name: publish

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write # create the GitHub Release
  id-token: write # OIDC trusted publishing + provenance attestation

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.x'

      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'

      # Trusted publishing (OIDC) requires npm >= 11.5.1; Node 22 still ships
      # npm 10.x, so upgrade the CLI before publishing.
      - name: Upgrade npm for trusted publishing
        run: npm install -g npm@latest

      - name: Install
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bun run typecheck

      - name: Tests
        run: bun test

      - name: Probes
        run: bun run probes

      - name: Verify version, tag, and changelog
        run: |
          set -euo pipefail
          PKG_NAME=$(node -p "require('./package.json').name")
          PKG_VERSION=$(node -p "require('./package.json').version")
          TAG_VERSION="${GITHUB_REF_NAME#v}"

          if [ "$PKG_VERSION" != "$TAG_VERSION" ]; then
            echo "::error::package.json version ($PKG_VERSION) does not match tag ($TAG_VERSION)"
            exit 1
          fi

          if ! grep -qE "^## \[${PKG_VERSION//./\\.}\]" CHANGELOG.md; then
            echo "::error::CHANGELOG.md has no '## [$PKG_VERSION]' section"
            exit 1
          fi

          PUBLISHED=$(npm view "$PKG_NAME@$PKG_VERSION" version 2>/dev/null || true)
          if [ -n "$PUBLISHED" ]; then
            echo "::error::$PKG_NAME@$PKG_VERSION is already published to npm"
            exit 1
          fi

          echo "OK: $PKG_NAME@$PKG_VERSION is ready to publish"

      # Inspect the real tarball via tar so the check does not depend on the
      # shape of `npm pack --json`, which has changed across npm major versions.
      - name: Verify package contents
        run: |
          set -euo pipefail
          npm pack --silent >/dev/null
          TARBALL=$(ls -t ./*.tgz | head -1)
          FILES=$(tar -tzf "$TARBALL" | sed 's|^package/||' | grep -v '/$')

          missing=""
          for r in package.json bin/harny.ts README.md CHANGELOG.md; do
            echo "$FILES" | grep -qx "$r" || missing="$missing $r"
          done
          if [ -n "$missing" ]; then
            echo "::error::missing from tarball:$missing"
            exit 1
          fi

          forbidden=$(echo "$FILES" | grep -E '(^|/)\.env|(^|/)\.harny/|(^|/)\.git/|(^|/)assistants\.json$' || true)
          if [ -n "$forbidden" ]; then
            echo "::error::unexpected sensitive files in tarball: $forbidden"
            exit 1
          fi

          echo "Tarball OK: $(echo "$FILES" | wc -l | tr -d ' ') files"
          rm -f "$TARBALL"

      # Authenticates via OIDC trusted publishing (no NPM_TOKEN). The package's
      # trusted publisher must be configured on npmjs.com to point at this repo
      # and workflow. Provenance is emitted automatically under trusted publishing.
      - name: Publish to npm
        run: npm publish --provenance --access public

      - name: Extract release notes
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          awk -v ver="$VERSION" '
            $0 ~ "^## \\[" ver "\\]" { grab = 1; next }
            grab && /^## \[/ { exit }
            grab { print }
          ' CHANGELOG.md > release-notes.md
          if [ ! -s release-notes.md ]; then
            echo "No release notes for $VERSION" > release-notes.md
          fi
          echo "--- release notes ---"
          cat release-notes.md

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --title "$GITHUB_REF_NAME" \
            --notes-file release-notes.md
