version: 1
name: review-fix
defaults:
  provider: claude
  timeout: 1800000
workspace:
  isolation: worktree
outcome:
  type: pull_request
nodes:
  - id: collect_feedback
    type: command
    command: [gh, pr, view]
  - id: developer
    type: agent
    command: review_fixer
    depends_on: [collect_feedback]
    requires: [structured_output, tool_guards]
    guards: [no_git_history]
  - id: validator
    type: agent
    command: validator
    depends_on: [developer]
    requires: [structured_output, tool_guards]
    guards: [read_only]
  - id: commit
    type: commit
    message: "fix: address review feedback"
    changeset: developer
    depends_on: [validator]
  - id: pull_request
    type: pull_request
    title: "Update existing PR"
    body: "Address review feedback"
    base: main
    head: "${{ run.branch }}"
    draft: true
    existing: require
    depends_on: [commit]
