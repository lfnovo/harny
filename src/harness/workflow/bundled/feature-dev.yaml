version: 1
name: feature-dev
defaults:
  provider: claude
  timeout: 1800000
workspace:
  isolation: worktree
outcome:
  type: branch
nodes:
  - id: planner
    type: agent
    command: planner
    requires: [structured_output]
  - id: persist_plan
    type: command
    command: [persist_plan]
    depends_on: [planner]
  - id: tasks
    type: foreach
    items: "${{ nodes.planner.outputs.tasks }}"
    as: task
    max_items: 100
    depends_on: [persist_plan]
    steps:
      - id: developer
        type: agent
        command: developer
        requires: [structured_output, tool_guards]
        guards: [no_plan_writes, no_git_history, no_forge_effects]
      - id: validator
        type: agent
        command: validator
        depends_on: [developer]
        requires: [structured_output, tool_guards]
        guards: [read_only]
        retry:
          max_attempts: 3
          return_to: developer
      - id: commit
        type: commit
        message: feature-dev
        changeset: developer
        depends_on: [validator]
