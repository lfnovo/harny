<body>
  <header>
    <div class="bar">
      <a class="brand" href="#/">
        <img class="mark" src="/collie.png" width="26" height="26" alt="" />
        harny <span class="ver mono" id="version"></span>
      </a>
      <span class="spacer"></span>
      <button class="icon-btn" id="themeBtn" title="Toggle theme" onclick="toggleTheme()" aria-label="Toggle theme">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
          <path class="sun" d="M12 3v2M12 19v2M5 5l1.5 1.5M17.5 17.5L19 19M3 12h2M19 12h2M5 19l1.5-1.5M17.5 6.5L19 5"/>
          <circle class="sun" cx="12" cy="12" r="3.6"/>
          <path class="moon" style="display:none" d="M20 14.5A8 8 0 1 1 9.5 4a6.5 6.5 0 0 0 10.5 10.5z"/>
        </svg>
      </button>
    </div>
  </header>
  <main><div id="app"><p class="mut">loading…</p></div></main>

  <script>
    const app = document.getElementById('app');
    const nowIso = () => new Date().toISOString();
    const cap = (s) => s.charAt(0).toUpperCase() + s.slice(1);

    // Poll refreshes DATA only: skip re-render when the server payload is
    // unchanged, and tick live time fields (elapsed / durations / "N ago")
    // in place so the DOM stays stable and animations never restart.
    let lastListSig = null, lastDetailSig = null, detailAnimate = true;
    const msOf = (iso) => (iso ? new Date(iso).getTime() : null);
    function liveDur(startIso, endIso) {
      if (!startIso) return '<span>—</span>';
      if (endIso) return `<span>${fmtDuration(durationMs(startIso, endIso))}</span>`;
      return `<span data-dur-start="${escapeHtml(startIso)}">${fmtDuration(Date.now() - msOf(startIso))}</span>`;
    }
    function agoSpan(iso) {
      return `<span data-iso="${escapeHtml(iso)}" title="${escapeHtml(fmtTime(iso))}">${escapeHtml(fmtRelative(iso))}</span>`;
    }
    function updateTimers() {
      const now = Date.now();
      document.querySelectorAll('[data-dur-start]').forEach(el => {
        // ISO, not ms: parseInt on an ISO string yields the year and reads as truthy.
        const s = Date.parse(el.dataset.durStart);
        if (Number.isFinite(s)) el.textContent = fmtDuration(now - s);
      });
      document.querySelectorAll('[data-iso]').forEach(el => { el.textContent = fmtRelative(el.dataset.iso); });
    }

    // --- theme ---------------------------------------------------------------
    function currentTheme() {
      return document.documentElement.getAttribute('data-theme')
        || (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
    }
    function applyIcon(theme) {
      const dark = theme === 'dark';
      document.querySelectorAll('#themeBtn .sun').forEach(e => e.style.display = dark ? '' : 'none');
      document.querySelector('#themeBtn .moon').style.display = dark ? 'none' : '';
    }
    function toggleTheme() {
      const next = currentTheme() === 'dark' ? 'light' : 'dark';
      document.documentElement.setAttribute('data-theme', next);
      applyIcon(next);
    }
    applyIcon(currentTheme());

    // --- formatting ----------------------------------------------------------
    function fmtTime(iso) {
      if (!iso) return '—';
      const d = new Date(iso);
      return `${d.toISOString().split('T')[0]} ${d.toTimeString().slice(0, 8)}`;
    }
    function fmtRelative(iso) {
      if (!iso) return '—';
      const diff = Date.now() - new Date(iso).getTime();
      if (diff < 0) return 'just now';
      const s = Math.floor(diff / 1000);
      if (s < 60) return `${s}s ago`;
      const m = Math.floor(s / 60);
      if (m < 60) return `${m}m ago`;
      const h = Math.floor(m / 60);
      if (h < 24) return `${h}h ago`;
      return `${Math.floor(h / 24)}d ago`;
    }
    function durationMs(a, b) {
      if (!a || !b) return null;
      return new Date(b).getTime() - new Date(a).getTime();
    }
    function fmtDuration(ms) {
      if (ms == null) return '—';
      if (ms < 1000) return `${ms}ms`;
      if (ms < 60000) return `${(ms / 1000).toFixed(1)}s`;
      return `${Math.floor(ms / 60000)}m${Math.floor((ms % 60000) / 1000)}s`;
    }
    function escapeHtml(s) {
      return String(s ?? '').replace(/[&<>"']/g, (c) => ({
        '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;',
      })[c]);
    }
    function truncate(s, n) {
      const str = String(s ?? '');
      return str.length > n ? str.slice(0, n) + '…' : str;
    }
    marked.setOptions({ breaks: true, gfm: true });
    function renderMarkdown(s) {
      if (!s) return '';
      return DOMPurify.sanitize(marked.parse(String(s)));
    }
    function renderTranscriptMarkdown(s) {
      if (!s) return '';
      return DOMPurify.sanitize(marked.parse(String(s)), { FORBID_TAGS: ['img', 'picture', 'source', 'video', 'audio', 'iframe'], FORBID_ATTR: ['src', 'srcset', 'poster'] });
    }

    // RunEvent is { at, run_id, type, node_id?, data? } -- see state/runSchema.ts.
    // This read `e.event` and `e.phase`, neither of which has ever existed on the
    // type, so the guard was always true and every row rendered `undefined`. That
    // is why the panel showed nothing but timestamps.
    const EVENT_TEXT = {
      'run.created': () => ({ text: 'run started', kind: 'info' }),
      'run.completed': () => ({ text: 'run completed', kind: 'pass' }),
      'run.failed': (e) => ({ text: `run failed${e.data && e.data.reason ? `: ${e.data.reason}` : ''}`, kind: 'fail' }),
      'run.cancelled': () => ({ text: 'run cancelled', kind: 'fail' }),
      'changeset.captured': (e) => ({ text: `changeset captured${countPaths(e)}`, kind: 'info' }),
      'changeset.validated': () => ({ text: 'changeset validated', kind: 'pass' }),
      'changeset.rejected': () => ({ text: 'changeset rejected', kind: 'fail' }),
      'changeset.committed': (e) => ({ text: `committed${e.data && e.data.sha ? ` ${String(e.data.sha).slice(0, 7)}` : ''}`, kind: 'pass' }),
      'human.asked': () => ({ text: 'waiting on you', kind: 'info' }),
      'human.answered': () => ({ text: 'answered', kind: 'info' }),
    };
    function countPaths(e) {
      const n = e.data && Array.isArray(e.data.entries) ? e.data.entries.length : null;
      return n == null ? '' : ` · ${n} file${n === 1 ? '' : 's'}`;
    }
    function eventSubstance(e, state, plan) {
      const build = EVENT_TEXT[e.type];
      if (build) return build(e);
      // Unknown types stay legible instead of vanishing: `node.failed` -> "node failed".
      const text = String(e.type || 'event').replace(/[._]/g, ' ');
      const kind = /fail|reject|error/.test(e.type || '') ? 'fail' : /pass|complete|commit/.test(e.type || '') ? 'pass' : 'info';
      return { text: e.node_id ? `${phaseLabel(e.node_id)} · ${text}` : text, kind };
    }

    function statusPill(status) {
      const map = { running: ['s-running', 'spin'], waiting_human: ['s-waiting', ''], done: ['s-done', ''], failed: ['s-failed', ''] };
      const [cls, spin] = map[status] || ['s-pending', ''];
      return `<span class="pill ${cls} ${spin}"><span class="d"></span>${escapeHtml(status)}</span>`;
    }
    // Which of the three roles a phase plays.
    //
    // Phase names are scoped by the workflow, not bare: a loop emits
    // `tasks:0.developer`, `tasks:0.validator`, `tasks:0.commit`, and the closing
    // gate is `final_validator`. Matching those with startsWith('developer')
    // fails for every one of them, and the old `if (idx < 0) idx = 0` fallback
    // then pinned the pipeline to Planner for the entire run. Match the leaf
    // segment and look for the role inside it instead.
    const ROLES = ['planner', 'developer', 'validator'];
    const ROLE_COLORS = ['var(--plan)', 'var(--run)', 'var(--done)'];
    function phaseRole(name) {
      const leaf = String(name || '').toLowerCase().split('.').pop();
      return ROLES.findIndex(role => leaf.includes(role));
    }
    /** Stage index to highlight: the running role if there is one, else the furthest reached. */
    function pipeIndex(phases) {
      const roled = (phases || []).map(p => ({ p, role: phaseRole(p.name) })).filter(x => x.role >= 0);
      if (!roled.length) return 0;
      const running = roled.find(x => x.p.status === 'running');
      if (running) return running.role;
      return roled[roled.length - 1].role;
    }
    function pipeHtml(status, phase) {
      const order = ROLES;
      const colors = ROLE_COLORS;
      const p = (phase || '').toLowerCase();
      let idx = phaseRole(p);
      const st = ['', '', ''];
      if (status === 'done') { st[0] = st[1] = st[2] = 'on'; }
      else if (status === 'failed') { if (idx < 0) idx = 0; for (let i = 0; i < 3; i++) st[i] = i < idx ? 'on' : (i === idx ? 'bad' : ''); }
      else if (status === 'running' || status === 'waiting_human') { if (idx < 0) idx = 0; for (let i = 0; i < 3; i++) st[i] = i < idx ? 'on' : (i === idx ? 'act' : ''); }
      let h = '<span class="pipe" title="planner · developer · validator">';
      for (let i = 0; i < 3; i++) {
        const c = st[i] === 'bad' ? 'st bad' : (st[i] ? 'st ' + st[i] : 'st');
        h += `<i class="${c}" style="--sc:${colors[i]}"></i>`;
        if (i < 2) h += `<i class="cn${st[i] === 'on' ? ' on' : ''}"></i>`;
      }
      return h + '</span>';
    }

    const COLLIE_IC_TAG = `<img src="/collie.png" width="20" height="20" alt="" />`;


    // --- empty-state hero ----------------------------------------------------
    const MASCOT = `<img src="/collie.png" width="150" height="150" alt="Harny, the border collie that herds the agents" />`;
    function heroHtml() {
      return `<div class="hero">
        <span class="eyebrow">Harness engineering, watched live</span>
        <h1>Meet <span class="grad">Harny</span> — the bot that runs your <span class="grad">agent loop</span></h1>
        <p class="lede">One harness pulls three agents in a tight loop: a planner drafts the work, a developer writes the code, a validator hunts the bugs. Harny holds the strings and commits only what passes.</p>
        <div class="stage-wrap"><div class="stage" id="stage">
          <svg class="ropes" viewBox="0 0 680 430" xmlns:xlink="http://www.w3.org/1999/xlink" preserveAspectRatio="none">
            <path id="rope-p" class="rope-path" d="M340 200 C340 176 340 158 340 128"/>
            <path id="rope-d" class="rope-path" d="M392 300 C432 322 470 326 516 316"/>
            <path id="rope-v" class="rope-path" d="M288 300 C248 322 210 326 164 316"/>
            <circle class="flow" r="3.6" fill="var(--accent)"><animateMotion dur="2.4s" repeatCount="indefinite"><mpath xlink:href="#rope-p"/></animateMotion></circle>
            <circle class="flow d2" r="3.6" fill="var(--run)"><animateMotion dur="2.4s" begin="0.8s" repeatCount="indefinite"><mpath xlink:href="#rope-d"/></animateMotion></circle>
            <circle class="flow d3" r="3.6" fill="var(--done)"><animateMotion dur="2.4s" begin="1.6s" repeatCount="indefinite"><mpath xlink:href="#rope-v"/></animateMotion></circle>
          </svg>
          <div class="node" id="n-plan"><div class="ncard"><div class="nhead"><span class="ndot"></span><span class="nname">Planner</span><span class="nact">planning<span class="dots"></span></span></div><div class="nbody"><svg class="pg" viewBox="0 0 176 74" width="100%" height="100%">
            <path class="edge" d="M40 20 L86 20"/><path class="edge e2" d="M40 20 L64 46"/><path class="edge e3" d="M86 20 L118 46"/><path class="edge e4" d="M64 46 L118 46"/>
            <circle class="pn n1" cx="40" cy="20" r="6"/><circle class="pn n2" cx="86" cy="20" r="6"/><circle class="pn n3" cx="64" cy="46" r="6"/><circle class="pn n4" cx="118" cy="46" r="6"/>
          </svg></div></div></div>
          <div class="node" id="n-dev"><div class="ncard"><div class="nhead"><span class="ndot"></span><span class="nname">Developer</span><span class="nact">writing<span class="dots"></span></span></div><div class="nbody"><div class="code">
            <div class="ln l1" style="--max:64%"><i></i></div><div class="ln l2" style="--max:88%"><i></i></div><div class="ln l3" style="--max:52%"><i></i></div><div class="ln l4" style="--max:76%"><i></i></div>
          </div></div></div></div>
          <div class="node" id="n-val"><div class="ncard"><div class="nhead"><span class="ndot"></span><span class="nname">Validator</span><span class="nact">checking<span class="dots"></span></span></div><div class="nbody"><div class="scan">
            <div class="sln" style="top:16px; width:120px"></div><div class="sln" style="top:32px; width:96px"></div><div class="sln" style="top:48px; width:132px"></div>
            <div class="bug"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 8v8M8 12h8M5 12H3M21 12h-2M6 6l1.5 1.5M18 6l-1.5 1.5"/><ellipse cx="12" cy="12" rx="5" ry="6" fill="currentColor" opacity="0.25"/></svg></div>
            <div class="caught"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round"><path d="M5 13l4 4L19 7"/></svg></div>
            <svg class="lens" viewBox="0 0 30 30"><circle class="glass" cx="12" cy="12" r="9"/><line class="handle" x1="19" y1="19" x2="26" y2="26"/></svg>
          </div></div></div></div>
          <div class="mascot">${MASCOT}<div class="shadow"></div></div>
        </div></div>
        <div class="agent-legend">
          <div class="leg"><div class="lh"><span class="lk" style="background:var(--plan)"></span>Planner</div><p>Reads the repo and produces a typed plan artifact with ordered tasks and acceptance criteria.</p></div>
          <div class="leg"><div class="lh"><span class="lk" style="background:var(--run)"></span>Developer</div><p>Implements one task at a time and proposes a commit message. Never commits itself.</p></div>
          <div class="leg"><div class="lh"><span class="lk" style="background:var(--done)"></span>Validator</div><p>Read-only, runs against the working tree. On pass, the harness commits the work.</p></div>
        </div>
        <div class="hero-cta">
          <button class="cta" onclick="location.hash='#/runs'">Open the dashboard →</button>
          <span class="install">
            <span class="mono dim">bunx @lfnovo/harny "&lt;prompt&gt;"</span>
            <span class="cp" title="Copy" onclick="navigator.clipboard && navigator.clipboard.writeText('bunx @lfnovo/harny')" aria-label="Copy">
              <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2"><rect x="9" y="9" width="11" height="11" rx="2"/><path d="M5 15V5a2 2 0 0 1 2-2h10"/></svg>
            </span>
          </span>
        </div>
      </div>`;
    }
    function fitStage() {
      const stage = document.getElementById('stage');
      if (!stage) return;
      const avail = Math.min(stage.parentElement.clientWidth, 680);
      const scale = Math.min(1, avail / 680);
      stage.style.transform = `scale(${scale})`;
      stage.parentElement.style.height = (430 * scale) + 'px';
    }
    window.addEventListener('resize', fitStage);

    // --- data ----------------------------------------------------------------
    async function fetchJSON(path) {
      const res = await fetch(path);
      if (!res.ok) throw new Error(`${path}: ${res.status}`);
      return res.json();
    }

    let pollHandle = null;
    function stopPoll() { if (pollHandle) { clearInterval(pollHandle); pollHandle = null; } }

    const openDetails = new Set();
    const transcriptCache = new Map();
    let activeTranscriptRun = null;
    function bindDetailsTracking(root) {
      root.querySelectorAll('details[data-detail-id]').forEach((el) => {
        const id = el.getAttribute('data-detail-id');
        if (openDetails.has(id)) el.open = true;
        el.addEventListener('toggle', () => { if (el.open) { openDetails.add(id); if (el.classList.contains('transcript') && activeTranscriptRun) void refreshTranscripts(activeTranscriptRun.cwdHash, activeTranscriptRun.slug); } else openDetails.delete(id); });
      });
    }

    // --- run list ------------------------------------------------------------
    function statCard(v, n, label) {
      return `<div class="stat" style="--c:var(--${v})"><div class="n num">${n}</div><div class="l"><span class="k"></span>${label}</div></div>`;
    }
    async function renderRunList(forceTable) {
      stopPoll();
      const draw = async () => {
        try {
          const { runs } = await fetchJSON('/api/runs');
          if (runs.length === 0 && !forceTable) {
            if (!document.getElementById('stage')) {
              app.innerHTML = heroHtml();
              fitStage();
              if (matchMedia('(prefers-reduced-motion: reduce)').matches) {
                const ropes = app.querySelector('.ropes');
                if (ropes && ropes.pauseAnimations) ropes.pauseAnimations();
              }
            }
            lastListSig = JSON.stringify(runs);
            return;
          }
          const sig = JSON.stringify(runs);
          if (sig === lastListSig && app.querySelector('table')) return;
          lastListSig = sig;
          const c = { running: 0, waiting_human: 0, done: 0, failed: 0 };
          runs.forEach(r => { if (c[r.status] !== undefined) c[r.status]++; });
          const rows = runs.map(r => {
            const retryCls = r.retries === 0 ? 'retry-0' : r.retries <= 2 ? 'retry-1' : 'retry-2';
            const project = r.cwd.split('/').filter(Boolean).pop() || r.cwd;
            return `<tr class="row" onclick="location.hash='#/runs/${r.cwd_hash}/${encodeURIComponent(r.task_slug)}'">
              <td class="mono dim">${escapeHtml(r.short_id)}</td>
              <td class="mut">${agoSpan(r.started_at)}</td>
              <td class="mut">${escapeHtml(r.workflow)}</td>
              <td class="slug">${escapeHtml(r.task_slug)}</td>
              <td>${statusPill(r.status)}</td>
              <td>${pipeHtml(r.status, r.current_phase)}</td>
              <td class="num ${retryCls}" title="${r.retries} phase retr${r.retries === 1 ? 'y' : 'ies'}">${r.retries}</td>
              <td class="r num mut">${liveDur(r.started_at, r.ended_at)}</td>
              <td class="cwd mono" title="${escapeHtml(r.cwd)}">${escapeHtml(project)}</td>
            </tr>`;
          }).join('');
          const emptyRow = rows ? '' : `<tr><td colspan="9" style="padding:26px 12px; text-align:center; color:var(--text-mut)">No runs yet — start one with <code class="mono" style="background:var(--surface-2); padding:1px 6px; border-radius:5px">bunx @lfnovo/harny "&lt;prompt&gt;"</code></td></tr>`;
          app.innerHTML = `
            <div style="display:flex; align-items:flex-end; justify-content:space-between; gap:16px; flex-wrap:wrap;">
              <div><h1>Runs</h1><p class="sub">${runs.length} run${runs.length === 1 ? '' : 's'} across all projects</p></div>
              <span class="live"><span class="pdot"></span>Auto-refreshing every 3s</span>
            </div>
            <div class="summary">
              ${statCard('run', c.running, 'Running')}
              ${statCard('wait', c.waiting_human, 'Waiting on you')}
              ${statCard('done', c.done, 'Done')}
              ${statCard('fail', c.failed, 'Failed')}
            </div>
            <div class="card"><div class="tablewrap"><table>
              <thead><tr><th>Run</th><th>Started</th><th>Workflow</th><th>Slug</th><th>Status</th><th>Pipeline</th><th>Retries</th><th class="r">Duration</th><th>Project</th></tr></thead>
              <tbody>${rows || emptyRow}</tbody>
            </table></div></div>`;
        } catch (e) {
          app.innerHTML = `<p style="color:var(--fail)">Error: ${escapeHtml(e.message)}</p>`;
        }
      };
      await draw();
      pollHandle = setInterval(draw, 3000);
    }

    // --- run detail ----------------------------------------------------------
    function usageNumber(value) { return Number(value || 0).toLocaleString('en-US'); }
    function usageCost(value, coverage) { return value == null ? '—' : `$${Number(value).toFixed(4)}${coverage === 'partial' ? ' partial' : ''}`; }
    function usageLine(value) {
      if (!value) return '';
      const parts = [`in ${usageNumber(value.input_tokens ?? value.inputTokens)}`, `out ${usageNumber(value.output_tokens ?? value.outputTokens)}`];
      const read = value.cache_read_input_tokens ?? value.cacheReadInputTokens ?? 0;
      const write = value.cache_creation_input_tokens ?? value.cacheCreationInputTokens ?? 0;
      const reasoning = value.reasoning_output_tokens ?? value.reasoningOutputTokens ?? 0;
      const cost = value.cost_usd ?? value.costUsd;
      if (read) parts.push(`cache-read ${usageNumber(read)}`);
      if (write) parts.push(`cache-write ${usageNumber(write)}`);
      if (reasoning) parts.push(`reasoning ${usageNumber(reasoning)}`);
      if (cost != null) parts.push(`$${Number(cost).toFixed(4)} reported`);
      return parts.join(' · ');
    }
    function usageModels(value) {
      return Object.entries((value && value.models) || {}).map(([model, metrics]) => `<div class="mut" style="font-size:11px;margin-top:5px"><span class="mono">${escapeHtml(model)}</span> · ${escapeHtml(usageLine(metrics))}</div>`).join('');
    }
    // --- live activity (replaces the old looping desk scenes) ----------------
    // A 3s animation loop says "something is happening" and tells you nothing.
    // The transcript is written as the agent works (no buffering), so the real
    // current tool call is available and it actually changes.
    const ACT_PENDING = '<div class="act act-idle"><span class="act-name">waiting for the first tool call</span></div>';

    // The one input field worth showing per tool. Anything unlisted falls back to
    // the first short string in the input, so a new tool degrades to something
    // sensible rather than to nothing.
    const TOOL_ARG = {
      Read: 'file_path', Write: 'file_path', Edit: 'file_path', MultiEdit: 'file_path',
      NotebookEdit: 'notebook_path', Bash: 'command', shell: 'command',
      Grep: 'pattern', Glob: 'pattern', WebFetch: 'url', web_search: 'query',
      Task: 'description', TodoWrite: null,
    };
    function toolArg(event) {
      const input = event.input;
      if (!input || typeof input !== 'object') return '';
      const key = Object.prototype.hasOwnProperty.call(TOOL_ARG, event.name) ? TOOL_ARG[event.name] : undefined;
      if (key === null) return '';
      if (key && typeof input[key] === 'string') return input[key];
      if (key === undefined) {
        const guess = Object.values(input).find(v => typeof v === 'string' && v.length && v.length < 160);
        if (typeof guess === 'string') return guess;
      }
      return '';
    }
    // Paths are long and the useful end is the right-hand one; keep the tail.
    function shortenArg(text, max = 52) {
      if (text.length <= max) return text;
      const oneLine = text.replace(/\s+/g, ' ');
      if (oneLine.includes('/')) return '…' + oneLine.slice(-(max - 1));
      return oneLine.slice(0, max - 1) + '…';
    }
    function activityHtml(records) {
      const items = collapseRecords(records);
      const tools = items.filter(r => r.event.type === 'tool');
      if (!tools.length) return ACT_PENDING;
      // "Now" is the newest tool still open; if none, the last one that finished.
      const open = [...tools].reverse().find(r => r.event.status === 'started' || r.event.status === 'updated');
      const current = open || tools[tools.length - 1];
      const e = current.event;
      const arg = toolArg(e);
      const files = new Set();
      items.forEach(r => { if (r.event.type === 'file_change') (r.event.changes || []).forEach(c => files.add(c.path)); });
      // Count every tool call, not just finished ones: "0 tools" while one is
      // visibly running reads as broken.
      const seen = tools.length;
      const failed = tools.filter(r => r.event.status === 'failed').length;
      // Duration is not a field: derive it from the envelope timestamps.
      const since = current.at_started || current.at;
      const live = Boolean(open);
      const cls = e.status === 'failed' ? 'act act-fail' : live ? 'act act-live' : 'act';
      const bits = [`${seen} tool${seen === 1 ? '' : 's'}`];
      if (failed) bits.push(`${failed} failed`);
      if (files.size) bits.push(`${files.size} file${files.size === 1 ? '' : 's'} touched`);
      return `<div class="${cls}">
        <span class="act-dot"></span>
        <span class="act-name">${escapeHtml(e.name)}</span>
        ${arg ? `<span class="act-arg mono" title="${escapeHtml(arg)}">${escapeHtml(shortenArg(arg))}</span>` : ''}
        <span class="act-time num">${live ? liveDur(since, null) : escapeHtml(e.status)}</span>
      </div><div class="act-sum">${escapeHtml(bits.join(' · '))}</div>`;
    }

    // --- timeline ------------------------------------------------------------
    // Every phase records started_at and ended_at, so the run's real shape — where
    // the time actually went — has been in the state all along and never on screen.
    // A waterfall shows it directly: offset is when it began, width is how long it
    // took. It replaces the old ribbon, which spent ~130px restating three names.

    /** Container phases (`tasks`) merely span their children; drawing both double-counts. */
    function isContainer(phase, all) {
      return all.some(other => other !== phase && other.name.startsWith(`${phase.name}:`));
    }
    /** `tasks:0.developer` -> `developer`; a second pass -> `developer 2`. */
    function phaseLabel(name) {
      const leaf = String(name).split('.').pop().replace(/_/g, ' ');
      const iter = String(name).match(/:(\d+)\./);
      const n = iter ? Number(iter[1]) : 0;
      return n > 0 ? `${leaf} ${n + 1}` : leaf;
    }
    const ROLE_VAR = ['var(--plan)', 'var(--run)', 'var(--done)'];
    function timelineHtml(state) {
      const all = (state.phases || []).filter(p => p.started_at);
      const rows = all.filter(p => !isContainer(p, all));
      if (!rows.length) return '';
      const t0 = msOf(state.origin.started_at);
      const endMs = state.lifecycle.ended_at ? msOf(state.lifecycle.ended_at) : Date.now();
      const span = Math.max(1, endMs - t0);
      const bars = rows.map(p => {
        const a = msOf(p.started_at);
        const b = p.ended_at ? msOf(p.ended_at) : Date.now();
        const left = Math.max(0, (a - t0) / span * 100);
        // Sub-second phases (the commit) would otherwise be invisible; floor the
        // width so every phase that happened can be seen to have happened.
        const width = Math.max(0.8, (b - a) / span * 100);
        const role = phaseRole(p.name);
        const color = role >= 0 ? ROLE_VAR[role] : 'var(--text-dim)';
        const live = p.status === 'running';
        const failed = p.status === 'failed';
        const pct = Math.round((b - a) / span * 100);
        const cls = ['tl-bar', live ? 'live' : '', failed ? 'fail' : ''].filter(Boolean).join(' ');
        return `<div class="tl-row" title="${escapeHtml(`${p.name} · ${fmtDuration(b - a)} · ${pct}% of the run`)}">
          <div class="tl-name">${escapeHtml(phaseLabel(p.name))}</div>
          <div class="tl-track"><div class="tl-grid"></div><div class="tl-lane">
            <div class="${cls}" style="--c:${failed ? 'var(--fail)' : color}; left:${left.toFixed(2)}%; width:${Math.min(width, 100 - left).toFixed(2)}%">
              ${live ? `<span class="tl-dog">${COLLIE_IC_TAG}</span>` : ''}
            </div>
          </div></div>
          <div class="tl-meta">
            <span class="tl-dur"${live ? ` data-dur-start="${escapeHtml(p.started_at)}"` : ''}>${fmtDuration(b - a)}</span>
            <span class="tl-pct">${pct >= 1 ? `${pct}%` : ''}</span>
          </div>
        </div>`;
      }).join('');
      // A four-tick axis: enough to read proportion at a glance, few enough to stay quiet.
      const axis = [0, 0.25, 0.5, 0.75, 1].map(f =>
        `<span style="left:${(f * 100).toFixed(0)}%">${f === 0 ? '0s' : fmtDuration(span * f)}</span>`).join('');
      return `<div class="card timeline reveal" style="--i:2">${bars}
        <div class="tl-axis"><div></div><div class="tl-axis-in">${axis}</div><div></div></div>
      </div>`;
    }

    function transcriptPanels(p) {
      const attempts = (p.attempts_detail || []).filter(a => a.transcript_available);
      if (!attempts.length) return '';
      return `<div class="transcripts">${attempts.map(a => {
        const key = `${p.instance_id}:${a.number}`;
        return `<details class="transcript" data-detail-id="transcript-${escapeHtml(key)}" data-instance="${escapeHtml(p.instance_id)}" data-attempt="${a.number}"><summary><span>Transcript · attempt ${a.number}</span><span class="tr-status ${statusCls(a.status)}">${escapeHtml(a.status)}</span></summary><div class="transcript-body" data-transcript-key="${escapeHtml(key)}"><span class="mut">Open to load events.</span></div></details>`;
      }).join('')}</div>`;
    }
    function jsonPayload(value) {
      if (value === undefined) return '';
      try { return `<pre class="tr-payload mono">${escapeHtml(JSON.stringify(value, null, 2))}</pre>`; }
      catch { return `<pre class="tr-payload mono">${escapeHtml(String(value))}</pre>`; }
    }
    // Collapse the started/updated/completed records of one tool, file_change or
    // plan into a single item, keyed by event id.
    //
    // This MERGES rather than replaces on purpose. Claude's adapter emits the real
    // tool name on tool_use but hardcodes name:"tool" on tool_result
    // (providers/claude.ts), so overwriting with the last record turns every
    // finished tool into a nameless "tool" and drops its input. Merging keeps the
    // identity fields from the first record and lets later ones advance status and
    // attach output. Codex names every record, so it is unaffected either way.
    const IDENTITY_WINS = ['name', 'kind', 'input'];
    function mergeRecords(older, newer) {
      const merged = { ...older.event, ...newer.event };
      for (const field of IDENTITY_WINS) {
        const first = older.event[field];
        const last = newer.event[field];
        if (first !== undefined && (last === undefined || last === 'tool')) merged[field] = first;
      }
      return { ...newer, at_started: older.at_started || older.at, event: merged };
    }
    function collapseRecords(records) {
      const items = []; const seen = new Map();
      records.forEach(record => {
        const event = record.event || {};
        const key = ['tool', 'file_change', 'plan'].includes(event.type) && event.id ? `${event.type}:${event.id}` : null;
        if (key && seen.has(key)) { const i = seen.get(key); items[i] = mergeRecords(items[i], record); }
        else { if (key) seen.set(key, items.length); items.push(record); }
      });
      return items;
    }
    function renderTranscript(records) {
      // `status` and `lifecycle` are provider plumbing: SessionStart hooks firing and
      // turn markers. They were 43% of a planner transcript and told a reader nothing
      // — none of them change what you would do next. Hidden when they behave.
      //
      // But a hook that FAILS is a different animal: it can break the run, and a
      // transcript that hides it would send you digging through the .jsonl by hand.
      // So routine plumbing is dropped and failing plumbing is surfaced, in red.
      //
      // Nothing is lost either way: the audit log is the .jsonl on disk, not this
      // view. The viewer is a reading tool and is allowed to stay quiet.
      const PLUMBING = new Set(['status', 'lifecycle']);
      const plumbingFailed = (e) =>
        e.status === 'failed' || e.status === 'cancelled' ||
        Boolean(e.data && (e.data.error || e.data.stderr)) ||
        /error|fail/i.test(String(e.name || ''));

      const items = collapseRecords(records);
      if (!items.length) return '<span class="mut">No transcript events yet.</span>';

      const out = [];
      for (const record of items) {
        const e = record.event;
        if (PLUMBING.has(e.type)) {
          if (!plumbingFailed(e)) continue;
          const when = fmtTime(record.at).split(' ').pop();
          out.push(`<div class="tr-event error"><details class="tr-sub"><summary><span class="tr-kind">provider</span><span class="tr-tool bad">${escapeHtml(e.name || `${e.scope} ${e.status}`)}</span><span class="tr-status">${escapeHtml(when)}</span></summary>${jsonPayload(e.data ?? e.message)}</details></div>`);
          continue;
        }
        const when = fmtTime(record.at).split(' ').pop();
        if (e.type === 'request') { out.push(`<div class="tr-event"><details class="tr-sub"><summary><span class="tr-kind">request</span>Prompt<span class="tr-status">${escapeHtml(when)}</span></summary>${jsonPayload({ prompt:e.prompt, system_prompt:e.systemPrompt, model:e.model, tools:e.tools, guards:e.guards })}</details></div>`); continue; }
        if (e.type === 'message') { out.push(`<div class="tr-event message"><div class="tr-label">${escapeHtml(e.role)} · ${escapeHtml(when)}</div><div class="tr-text">${renderTranscriptMarkdown(e.text)}</div></div>`); continue; }
        if (e.type === 'reasoning') { out.push(`<div class="tr-event"><details class="tr-sub"><summary><span class="tr-kind">thought</span><span class="tr-peek">${escapeHtml(shortenArg(String(e.text || '').replace(/\s+/g, ' '), 72))}</span><span class="tr-status">${escapeHtml(when)}</span></summary><div class="tr-text">${renderTranscriptMarkdown(e.text)}</div></details></div>`); continue; }
        if (e.type === 'tool') {
          // The arg is the point: "Read" says nothing, "Read src/text.ts" says it all.
          const arg = toolArg(e);
          const bad = e.status === 'failed';
          out.push(`<div class="tr-event${bad ? ' error' : ''}"><details class="tr-sub"><summary><span class="tr-tool${bad ? ' bad' : ''}">${escapeHtml(e.name)}</span>${arg ? `<span class="tr-peek mono" title="${escapeHtml(arg)}">${escapeHtml(shortenArg(arg, 68))}</span>` : ''}<span class="tr-status ${bad ? 's-failed' : ''}">${escapeHtml(bad ? 'failed' : when)}</span></summary>${jsonPayload({ kind:e.kind, input:e.input, output:e.output, error:e.error })}</details></div>`);
          continue;
        }
        if (e.type === 'file_change') { const n = (e.changes || []).length; out.push(`<div class="tr-event"><details class="tr-sub"><summary><span class="tr-kind">files</span><span class="tr-peek mono">${escapeHtml((e.changes || []).map(c => c.path).join(', '))}</span><span class="tr-status">${n} changed</span></summary>${jsonPayload(e.changes)}</details></div>`); continue; }
        if (e.type === 'plan') { out.push(`<div class="tr-event"><details class="tr-sub"><summary><span class="tr-kind">plan</span><span class="tr-peek">${escapeHtml((e.items || []).map(i => i.text).join(' · '))}</span><span class="tr-status ${statusCls(e.status)}">${escapeHtml(e.status)}</span></summary>${jsonPayload(e.items)}</details></div>`); continue; }
        if (e.type === 'usage') { out.push(`<div class="tr-event"><div class="tr-label">usage</div><div class="tr-text mono">${escapeHtml(usageLine(e.usage))}</div></div>`); continue; }
        if (e.type === 'error') { out.push(`<div class="tr-event error"><div class="tr-label">error${e.retryable ? ' · retryable' : ''}</div><div class="tr-text">${escapeHtml(e.message)}</div></div>`); continue; }
        out.push(`<div class="tr-event"><div class="tr-label">${escapeHtml(e.name || e.type)}</div>${jsonPayload(e.data)}</div>`);
      }
      return out.join('');
    }
    // Pull one attempt's new events and cache them. The API paginates forward from
    // a seq cursor, so keeping `after` between polls means each call costs only the
    // delta. `complete` tells us the attempt finished; once it has and we have
    // drained it, there is nothing left to ask for.
    async function pullTranscript(cwdHash, slug, instance, attempt) {
      const key = `${cwdHash}:${slug}:${instance}:${attempt}`;
      const cached = transcriptCache.get(key) || { after: 0, records: [], done: false };
      if (cached.done) return cached;
      const page = await fetchJSON(`/api/runs/${cwdHash}/${encodeURIComponent(slug)}/transcripts?instance=${encodeURIComponent(instance)}&attempt=${attempt}&after=${cached.after}&limit=200`);
      if (page.events.length) { cached.records.push(...page.events); cached.after = page.next_after; }
      // Only stop once the attempt is finished AND this page did not fill: a full
      // page means more is waiting even if the attempt already ended.
      if (page.complete && page.events.length < 200) cached.done = true;
      transcriptCache.set(key, cached);
      return cached;
    }
    async function refreshTranscripts(cwdHash, slug) {
      activeTranscriptRun = { cwdHash, slug };
      const panels = [...app.querySelectorAll('details.transcript[open]')];
      const live = [...app.querySelectorAll('[data-act]')];
      await Promise.all([
        ...panels.map(async panel => {
          const instance = panel.dataset.instance; const attempt = Number(panel.dataset.attempt);
          try {
            const cached = await pullTranscript(cwdHash, slug, instance, attempt);
            const body = panel.querySelector('.transcript-body'); if (body) body.innerHTML = renderTranscript(cached.records);
          } catch (error) { const body = panel.querySelector('.transcript-body'); if (body) body.innerHTML = `<span style="color:var(--fail)">${escapeHtml(error.message)}</span>`; }
        }),
        // The running phase's activity line needs its transcript even when the
        // panel below it is closed, so fetch it on its own.
        ...live.map(async frame => {
          const [instance, attemptRaw] = (frame.dataset.act || '').split(':');
          const attempt = Number(attemptRaw);
          if (!instance || !Number.isFinite(attempt)) return;
          try {
            const cached = await pullTranscript(cwdHash, slug, instance, attempt);
            // Written in place, never through the main render: activity changes far
            // more often than the run signature, and re-rendering the page for it
            // would restart every animation and collapse open panels.
            const html = activityHtml(cached.records);
            if (frame.innerHTML !== html) frame.innerHTML = html;
          } catch { /* the line is decoration for a live run; a failed poll retries in 3s */ }
        }),
      ]);
    }
    /** Status words share the pill palette: one status, one colour, everywhere. */
    const STATUS_CLS = { completed:'s-done', done:'s-done', skipped:'s-done', running:'s-running',
                         in_progress:'s-running', failed:'s-failed', cancelled:'s-failed',
                         parked:'s-waiting', paused:'s-waiting', waiting_human:'s-waiting', pending:'s-pending' };
    const statusCls = (s) => STATUS_CLS[s] || '';

    function phaseRow(p) {
      const dur = liveDur(p.started_at, p.ended_at);
      const sid = p.session_id ? p.session_id.slice(0, 8) : '—';
      const name = p.attempt > 1 ? `${phaseLabel(p.name)} #${p.attempt}` : phaseLabel(p.name);
      if (p.status === 'running') {
        return `<div class="phase-wrap"><div class="phase run">
          <div class="runhead">
            <span class="tnode run"></span>
            <span class="pname">${escapeHtml(name)} <span class="pill s-running spin" style="margin-left:8px"><span class="d"></span>running</span></span>
            <span class="runmeta"><span class="pdur">${dur}</span><span class="psid mono" title="session id">${escapeHtml(sid)}</span></span>
          </div>
          <div class="workframe" data-act="${escapeHtml(`${p.instance_id}:${p.attempt}`)}">${ACT_PENDING}</div>
        </div>${transcriptPanels(p)}</div>`;
      }
      const ok = p.status === 'completed';
      const phaseCls = ok ? 'phase ok' : p.status === 'failed' ? 'phase' : 'phase';
      let nodeCls = 'tnode';
      if (!ok) {
        if (p.status === 'failed') nodeCls += ' fail';
        else if (p.status === 'parked') nodeCls += ' parked';
        else if (phaseRole(p.name) === 0) nodeCls += ' planner';
      }
      const v = phaseVerdict(p);
      return `<div class="phase-wrap"><div class="${phaseCls}">
        <span class="${nodeCls}"></span>
        <div class="pmain"><span class="pname">${escapeHtml(name)}</span></div>
        <div class="pright">${v ? `<span class="pverdict ${v.kind}">${escapeHtml(v.text)}</span>` : ''}${phaseCost(p)}<span class="pdur">${dur}</span></div>
      </div>${transcriptPanels(p)}</div>`;
    }

    /** Just the cost. The full token breakdown wrapped into two unreadable grey
     *  lines; it lives in the provenance fold where someone auditing spend looks. */
    function phaseCost(p) {
      const c = p.usage && p.usage.cost_usd;
      if (c == null) return '';
      return `<span class="pcost mono" title="${escapeHtml(usageLine(p.usage))}">${escapeHtml(usageCost(c, p.usage.cost_coverage))}</span>`;
    }

    /** The one thing each phase decided, in the fewest words that stay true. */
    function phaseVerdict(p) {
      if (!p.verdict) return null;
      let v; try { v = JSON.parse(p.verdict); } catch { return null; }
      const role = phaseRole(p.name);
      if (role === 0 && Array.isArray(v.tasks)) return { text: `${v.tasks.length} task${v.tasks.length === 1 ? '' : 's'}`, kind: 'info' };
      if (role === 2 || typeof v.verdict === 'string') {
        const pass = v.verdict === 'pass';
        return { text: String(v.verdict ?? ''), kind: pass ? 'ok' : 'bad' };
      }
      if (v.verdict && typeof v.verdict === 'object' && v.verdict.status) {
        return { text: String(v.verdict.status), kind: v.verdict.status === 'done' ? 'ok' : 'bad' };
      }
      if (v.sha) return { text: String(v.sha).slice(0, 7), kind: 'mono' };
      return null;
    }
    function iterTitle(group) {
      const dev = group.find(p => phaseRole(p.name) === 1 && p.verdict);
      if (dev) { try { const v = JSON.parse(dev.verdict); const s = (v.commit_message || '').split('\n')[0].trim(); if (s) return truncate(s, 70); } catch {} }
      return '';
    }

    async function renderRunDetail(cwdHash, slug) {
      stopPoll();
      const draw = async () => {
        try {
          const [{ state, plan }, { commits, error: gitErr }, { siblingBranches }] = await Promise.all([
            fetchJSON(`/api/runs/${cwdHash}/${encodeURIComponent(slug)}`),
            fetchJSON(`/api/runs/${cwdHash}/${encodeURIComponent(slug)}/git-log`),
            fetchJSON(`/api/runs/${cwdHash}/${encodeURIComponent(slug)}/sibling-branches`).catch(() => ({ siblingBranches: [] })),
          ]);

          const sig = JSON.stringify({ state, plan, commits, gitErr, siblingBranches });
          if (sig === lastDetailSig && app.querySelector('.head')) { await refreshTranscripts(cwdHash, slug); return; }
          const animate = detailAnimate;
          detailAnimate = false;
          lastDetailSig = sig;

          const allPhases = state.phases.filter(p => p.name !== 'committing');
          const visiblePhases = allPhases.filter(p => !isContainer(p, allPhases));
          const groups = [];
          let curGroup = [];
          visiblePhases.forEach(p => {
            if (phaseRole(p.name) === 1 && curGroup.some(x => phaseRole(x.name) === 1)) { groups.push(curGroup); curGroup = []; }
            curGroup.push(p);
          });
          if (curGroup.length) groups.push(curGroup);
          const phasesHtml = groups.map((g, i) => {
            const title = iterTitle(g);
            return `<div class="iter"><div class="iter-h"><span class="iter-tag">Iteration ${i + 1}</span>${title ? `<span class="t">${escapeHtml(title)}</span>` : ''}</div>${g.map(phaseRow).join('')}</div>`;
          }).join('');

          const live = state.lifecycle.status === 'running' || state.lifecycle.status === 'waiting_human';
          const elapsedHtml = liveDur(state.origin.started_at, state.lifecycle.ended_at);
          const iterN = (plan && plan.iterations_global != null) ? plan.iterations_global : groups.length;
          const tasksKpi = (plan && Array.isArray(plan.tasks) && plan.tasks.length) ? `${plan.tasks.filter(t => t.status === 'done').length}/${plan.tasks.length}` : '—';
          const retriesKpi = visiblePhases.reduce((n, p) => n + Math.max(0, (p.attempt || 1) - 1), 0);

          // --- the facts line -------------------------------------------------
          // The same numbers the four KPI cards used to shout, on one line. A card
          // per number gave "0 retries" the same weight as the elapsed time, and
          // spent the first screen on counts instead of on what the run produced.
          // Zeros are dropped: no retries is the boring default and deserves silence.
          // Each fact carries its own markup: `elapsedHtml` is already a <span> with
          // the data-dur-start hook the live timer ticks, so escaping it here would
          // print the tag AND stop the clock. Plain strings get escaped as they are
          // added; nothing in this list is escaped twice.
          const facts = [`<span class="f-ctx">${escapeHtml(state.origin.workflow)}</span>`, `<span class="f-val">${elapsedHtml}</span>`];
          const addFact = (text) => facts.push(`<span class="f-val">${escapeHtml(text)}</span>`);
          if (tasksKpi !== '—') addFact(`${tasksKpi} task${plan.tasks.length === 1 ? '' : 's'}`);
          if (iterN > 1) addFact(`${iterN} iterations`);
          if (retriesKpi > 0) addFact(`${retriesKpi} retr${retriesKpi === 1 ? 'y' : 'ies'}`);
          const totalUsage = state.usage && state.usage.total;
          if (totalUsage && totalUsage.cost_usd != null) addFact(usageCost(totalUsage.cost_usd, totalUsage.cost_coverage));
          const factsHtml = facts.join('<i class="f-sep" aria-hidden="true"></i>');

          // --- outcome ---------------------------------------------------------
          // What the run produced, which is the question the page is opened to
          // answer. It used to be nowhere on the first screen.
          function outcomeHtml() {
            const done = state.lifecycle.status === 'done';
            const failed = state.lifecycle.status === 'failed';
            if (!done && !failed) return '';
            const tasks = (plan && Array.isArray(plan.tasks)) ? plan.tasks : [];
            // The commit message lives on the developer's verdict, the sha on the
            // task; the touched paths come from the ChangeSet the harness committed.
            const rows = tasks.map(task => {
              const dev = visiblePhases.find(p => phaseRole(p.name) === 1 && p.verdict && p.name.includes(`:${tasks.indexOf(task)}.`));
              let message = '', files = [];
              if (dev) { try { const v = JSON.parse(dev.verdict); message = v.verdict?.commit_message || ''; files = (v.changeSet?.entries || []).map(e => e.path); } catch {} }
              const sha = task.commit_sha ? String(task.commit_sha).slice(0, 7) : null;
              const ok = task.status === 'done';
              return `<div class="oc-row">
                <svg class="oc-mark ${ok ? 'ok' : 'bad'}" viewBox="0 0 22 22" aria-hidden="true">
                  <circle class="oc-ring" cx="11" cy="11" r="9.6"/>
                  ${ok
                    ? '<path class="oc-tick" d="M6.4 11.3 L9.6 14.4 L15.6 7.9"/>'
                    : '<path class="oc-tick" d="M7.4 7.4 L14.6 14.6 M14.6 7.4 L7.4 14.6"/>'}
                </svg>
                <div class="oc-main">
                  <div class="oc-msg">${escapeHtml(message || task.title || task.id)}</div>
                  <div class="oc-meta">${sha ? `<span class="mono">${escapeHtml(sha)}</span><span class="dim">·</span>` : ''}${files.length ? `<span>${files.length} file${files.length === 1 ? '' : 's'}</span>` : `<span>${escapeHtml(task.status)}</span>`}</div>
                  ${files.length ? `<div class="oc-files mono">${files.map(f => `<span>${escapeHtml(f)}</span>`).join('')}</div>` : ''}
                </div>
              </div>`;
            }).join('');
            if (!rows) return '';
            const branch = state.environment.branch;
            return `<div class="section-h reveal" style="--i:2"><h2>${failed ? 'What happened' : 'Outcome'}</h2>${branch ? `<span class="meta mono">${escapeHtml(branch)}</span>` : ''}</div>
              <div class="card outcome reveal" style="--i:2">${rows}
                ${branch ? `<div class="oc-cta"><code class="mono">git checkout ${escapeHtml(branch)}</code></div>` : ''}
              </div>`;
          }

          let usageHtml = '';
          const usage = state.usage && state.usage.total;
          if (usage && (usage.input_tokens || usage.output_tokens || usage.cache_read_input_tokens || usage.cache_creation_input_tokens || usage.reasoning_output_tokens || usage.cost_usd != null)) {
            const cache = (usage.cache_read_input_tokens || 0) + (usage.cache_creation_input_tokens || 0);
            const providers = Object.entries(state.usage.by_provider || {}).map(([provider, value]) => `<div class="phase ok"><span class="tnode"></span><div class="pmain"><span class="pname">${escapeHtml(provider)}</span><div class="mut" style="font-size:11px;margin-top:3px">${escapeHtml(usageLine(value))}</div></div></div>`).join('');
            // These are columns of numbers meant to be compared, so they belong in a
            // table. usageLine() ran all five into one sentence, which wrapped to
            // three lines per row and buried the one genuinely actionable field —
            // the model. cache-read and cache-write are the two biggest numbers here
            // and the least actionable: summed into one column, kept for the audit.
            const rows = visiblePhases.flatMap(phase => (phase.attempts_detail || [])
              .filter(a => a.usage)
              .map(a => {
                const u = a.usage;
                const cacheN = (u.cacheReadInputTokens || 0) + (u.cacheCreationInputTokens || 0);
                const many = (phase.attempts_detail || []).length > 1;
                // The model is the point of this table: strip the vendor prefix so the
                // column stays narrow and the difference between rows is what shows.
                const model = String(u.model || '').replace(/^claude-/, '').replace(/^gpt-/, '');
                return `<tr${a.status === 'failed' ? ' class="ua-fail"' : ''}>
                  <td class="ua-name">${escapeHtml(phaseLabel(phase.name))}${many ? `<span class="ua-att">#${a.number}</span>` : ''}</td>
                  <td class="ua-model mono">${escapeHtml(model || u.provider || '—')}</td>
                  <td class="num">${escapeHtml(usageNumber(u.inputTokens))}</td>
                  <td class="num">${escapeHtml(usageNumber(u.outputTokens))}</td>
                  <td class="num dim">${escapeHtml(usageNumber(cacheN))}</td>
                  <td class="num ua-cost">${escapeHtml(u.costUsd != null ? usageCost(u.costUsd) : '—')}</td>
                </tr>`;
              })).join('');
            usageHtml = `<div class="tablewrap"><table class="ua">
                <thead><tr><th>phase</th><th>model</th><th class="r">in</th><th class="r">out</th><th class="r">cache</th><th class="r">cost</th></tr></thead>
                <tbody>${rows || '<tr><td colspan="6" class="mut">No attempt metrics.</td></tr>'}</tbody>
                <tfoot><tr><td colspan="2">total</td>
                  <td class="num">${escapeHtml(usageNumber(usage.input_tokens))}</td>
                  <td class="num">${escapeHtml(usageNumber(usage.output_tokens))}</td>
                  <td class="num dim">${escapeHtml(usageNumber(cache))}</td>
                  <td class="num ua-cost">${escapeHtml(usageCost(usage.cost_usd, usage.cost_coverage))}</td>
                </tr></tfoot>
              </table></div>`;
          }

          let planHtml = '';
          if (plan && Array.isArray(plan.tasks) && plan.tasks.length > 0) {
            const done = plan.tasks.filter(t => t.status === 'done').length;
            const failed = plan.tasks.filter(t => t.status === 'failed').length;
            const summaryLine = `${done}/${plan.tasks.length} done${failed ? ` · <span style="color:var(--fail)">${failed} failed</span>` : ''}${plan.iterations_global != null ? ` · ${plan.iterations_global} global iter${plan.iterations_global === 1 ? '' : 's'}` : ''}`;
            const taskRows = plan.tasks.map(t => {
              const pillCls = t.status === 'done' ? 's-done' : t.status === 'failed' ? 's-failed' : t.status === 'in_progress' ? 's-running spin' : 's-pending';
              const attemptsCls = t.attempts <= 1 ? 'retry-0' : t.attempts <= 2 ? 'retry-1' : 'retry-2';
              const sha = t.commit_sha ? `<span class="mono dim" title="${escapeHtml(t.commit_sha)}">${escapeHtml(t.commit_sha.slice(0, 8))}</span>` : '<span class="dim">—</span>';
              const desc = (t.description && t.description !== t.title) ? `<div class="task-md">${renderMarkdown(t.description)}</div>` : '';
              const acc = (t.acceptance ?? []).length ? `<ul style="margin:8px 0 0; padding-left:16px; color:var(--text-dim); font-size:12px">${t.acceptance.map(a => `<li>${escapeHtml(a)}</li>`).join('')}</ul>` : '';
              const body = (desc || acc) ? `<div class="task-body">${desc}${acc}</div>` : '';
              return `<details class="task" data-detail-id="task-${escapeHtml(t.id)}"><summary><span class="tid mono">${escapeHtml(t.id)}</span><span class="ttitle">${escapeHtml(t.title)}</span><span class="pill ${pillCls}"><span class="d"></span>${escapeHtml(t.status)}</span><span class="num ${attemptsCls}">${t.attempts}</span>${sha}</summary>${body}</details>`;
            }).join('');
            planHtml = `<div class="section-h reveal" style="--i:4"><h2>Plan tasks</h2><span class="meta">${summaryLine}</span></div><div class="card reveal" style="--i:4; margin-bottom:24px">${taskRows}</div>`;
          }

          let pendingHtml = '';
          if (state.pending_question) {
            const pq = state.pending_question;
            const opts = (pq.options ?? []).length ? `<pre class="mono" style="margin:8px 0 0; font-size:12px; background:var(--surface-2); padding:8px 10px; border-radius:8px; overflow:auto">${escapeHtml(JSON.stringify(pq.options, null, 2))}</pre>` : '';
            pendingHtml = `<div class="panel" style="border-color:color-mix(in srgb,var(--wait) 40%,var(--border)); background:var(--wait-bg); margin-bottom:24px">
              <div style="display:flex; align-items:center; gap:10px; margin-bottom:8px"><h3 style="margin:0; color:var(--wait)">Waiting for human input</h3><span class="pill s-waiting"><span class="d"></span>${escapeHtml(pq.kind || 'question')}</span></div>
              <p style="margin:0; color:var(--text)">${escapeHtml(pq.prompt)}</p>${opts}
              <p class="mut" style="margin:10px 0 0; font-size:12px">Answer in your terminal: <code class="mono" style="background:var(--surface-2); padding:1px 6px; border-radius:5px">harny answer ${escapeHtml(state.run_id.slice(0, 8))}</code></p>
            </div>`;
          }

          // This is a collision warning, not a listing. Other harny runs touched the
          // same paths on their own branches; merging both silently drops one side's
          // work. AGENTS.md calls it out as a real footgun, but the panel showed a
          // branch name and a bullet list with no hint of why anyone should care.
          let siblingHtml = '';
          if (Array.isArray(siblingBranches) && siblingBranches.length > 0) {
            const totalFiles = siblingBranches.reduce((n, s) => n + s.files.length, 0);
            const entries = siblingBranches.map(s => `<div class="sib-row">
              <div class="sib-branch mono">${escapeHtml(s.branch)}</div>
              <div class="sib-files">${s.files.map(f => `<span class="mono">${escapeHtml(f)}</span>`).join('')}</div>
            </div>`).join('');
            siblingHtml = `<div class="section-h reveal" style="--i:5"><h2>Also touched by other runs</h2><span class="meta">${siblingBranches.length} branch${siblingBranches.length === 1 ? '' : 'es'} · ${totalFiles} file${totalFiles === 1 ? '' : 's'}</span></div>
              <div class="card sib reveal" style="--i:5">
                <p class="sib-why">These branches changed the same files as this run. Merging both will silently drop one side's work — review them together before merging.</p>
                ${entries}
              </div>`;
          }

          const commitsHtml = (gitErr || commits.length === 0)
            ? `<p class="mut" style="font-size:12px">${escapeHtml(gitErr || 'No commits yet on this branch.')}</p>`
            : `<div class="gg">${commits.map(c => `<div class="commit"><span class="sha mono">${escapeHtml(c.sha)}</span><div><div class="csub">${escapeHtml(c.subject)}</div><span class="dim" style="font-size:12px" data-iso="${escapeHtml(c.date)}" title="${escapeHtml(fmtTime(c.date))}">${escapeHtml(fmtRelative(c.date))}</span></div></div>`).join('')}</div>`;

          // `execution.checkpoint` is the scheduler writing state to disk — 18 of this
          // run's 23 events. Keeping them pushed the five that tell the story
          // (captured -> validated -> committed) out of the visible twelve, and they
          // carry no phase or message, so every row rendered as a bare timestamp.
          const recent = state.history.filter(e => e.type !== 'execution.checkpoint').slice(-12).reverse();
          const eventsHtml = recent.map(e => {
            const sub = eventSubstance(e, state, plan);
            const cls = sub.kind === 'pass' ? 'pass' : sub.kind === 'fail' ? 'fail' : '';
            return `<div class="ev"><span class="when" data-iso="${escapeHtml(e.at)}" title="${escapeHtml(fmtTime(e.at))}">${escapeHtml(fmtRelative(e.at))}</span><span class="msg ${cls}">${escapeHtml(sub.text)}</span></div>`;
          }).join('');
          const liveHd = state.lifecycle.status === 'running' ? '<span class="live-hd"></span>' : '';

          app.innerHTML = `<div class="${animate ? 'animate' : ''}">
            <a class="back" href="#/">← all runs</a>
            <div class="head reveal" style="--i:0">
              <div>
                <h1>${escapeHtml(state.origin.task_slug)}</h1>
                <div class="metaline">${statusPill(state.lifecycle.status)}${factsHtml}</div>
              </div>
            </div>
            ${pendingHtml}
            <div class="ask reveal" style="--i:1" onclick="this.classList.toggle('open')" title="click to expand">
              <p>${escapeHtml(state.origin.prompt)}</p>
            </div>
            <div class="section-h reveal" style="--i:2"><h2>${live ? 'Live pipeline' : 'Timeline'}</h2><span class="meta">where the time went</span></div>
            ${timelineHtml(state)}
            ${outcomeHtml()}
            ${planHtml}
            <div class="section-h reveal" style="--i:5"><h2>Phases</h2><span class="meta">grouped by iteration</span></div>
            <div class="card reveal" style="--i:5; padding:14px; margin-bottom:24px">${phasesHtml || '<p class="mut" style="padding:8px">No phases yet.</p>'}</div>
            ${siblingHtml}
            <!-- Provenance. It sits last because the outcome earns the first screen,
                 but it stays open: hiding it behind a click made the reader do work to
                 reach data that was already written and already theirs. -->
            <div class="section-h reveal" style="--i:6"><h2>Cost, origin &amp; history</h2><span class="meta mono">${escapeHtml(usageLine(state.usage.total || {}))}</span></div>
            <div class="card fold reveal" style="--i:6">
              <div class="fold-body">
                ${usageHtml}
                <div class="grid2">
                  <div class="panel"><h3>Origin</h3><dl>
                    <dt>prompt</dt><dd>${escapeHtml(state.origin.prompt)}</dd>
                    <dt>started</dt><dd class="mono">${escapeHtml(fmtTime(state.origin.started_at))}</dd>
                    <dt>by</dt><dd class="mono">${escapeHtml(state.origin.user)}@${escapeHtml(state.origin.host)}</dd>
                    <dt>run id</dt><dd class="mono">${escapeHtml(state.run_id)}</dd>
                  </dl></div>
                  <div class="panel"><h3>Environment</h3><dl>
                    <dt>cwd</dt><dd class="mono">${escapeHtml(state.environment.cwd)}</dd>
                    <dt>branch</dt><dd class="mono">${escapeHtml(state.environment.branch)}</dd>
                    <dt>isolation</dt><dd>${escapeHtml(state.environment.isolation)}</dd>
                    <dt>mode</dt><dd>${escapeHtml(state.environment.mode)}</dd>
                    ${state.lifecycle.ended_at ? `<dt>ended</dt><dd class="mono">${escapeHtml(fmtTime(state.lifecycle.ended_at))}</dd>` : ''}
                  </dl></div>
                </div>
                <div class="grid2" style="margin-top:16px">
                  <div class="panel"><h3>Commits on ${escapeHtml(state.environment.branch)}</h3>${commitsHtml}</div>
                  <div class="panel"><h3>Recent events${liveHd}</h3><div class="events">${eventsHtml || '<p class="mut" style="font-size:12px">No events yet.</p>'}</div></div>
                </div>
              </div>
            </div>
          </div>`;
          bindDetailsTracking(app);
          await refreshTranscripts(cwdHash, slug);
        } catch (e) {
          app.innerHTML = `<a class="back" href="#/">← all runs</a><p style="margin-top:16px; color:var(--fail)">Error: ${escapeHtml(e.message)}</p>`;
        }
      };
      await draw();
      pollHandle = setInterval(draw, 3000);
    }

    // --- routing -------------------------------------------------------------
    function route() {
      openDetails.clear();
      lastListSig = null; lastDetailSig = null; detailAnimate = true;
      const hash = location.hash || '#/';
      const m = hash.match(/^#\/runs\/([^/]+)\/(.+)$/);
      if (m) renderRunDetail(m[1], decodeURIComponent(m[2]));
      else if (hash === '#/runs') renderRunList(true);
      // The hero was reachable only by having zero runs, i.e. once per install and
      // never again. This makes it addressable without deleting anything.
      else if (hash === '#/welcome') { app.innerHTML = heroHtml(); stopPoll(); }
      else renderRunList();
    }
    window.addEventListener('hashchange', route);
    route();
    setInterval(updateTimers, 1000);

    fetchJSON('/api/meta')
      .then(({ version }) => { const el = document.getElementById('version'); if (el) el.textContent = `v${version}`; })
      .catch(() => {});
  </script>
</body>
</html>
