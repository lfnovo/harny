  <script src="https://cdn.jsdelivr.net/npm/marked@14.1.3/marked.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/dompurify@3.1.6/dist/purify.min.js"></script>
  <style>
    :root {
      --bg:#0D0E11; --bg-2:#111318; --surface:#171A20; --surface-2:#1D2128;
      --border:#262B34; --border-2:#333A45; --text:#F2F3F5; --text-mut:#969DA8; --text-dim:#6A717C;
      --accent:#4DA3F0; --accent-2:#7CC0FF; --accent-bg:rgba(77,163,240,0.14); --accent-line:rgba(77,163,240,0.38);
      --plan:#8FA6BC; --plan-bg:rgba(143,166,188,0.14);
      /* Role colours: WHO ran the phase, not how it went. Kept off the status
         tokens on purpose -- once status went GitHub-yellow, a developer bar
         painted with --run read as "in progress" on a run that had long finished. */
      --role-plan:#8FA6BC; --role-dev:#4DA3F0; --role-val:#5FD39B;
      /* Status speaks GitHub's colour language, because that is the language the
         people reading this page already read all day: yellow is in flight, green
         landed, red broke, purple wants a human. `running` taking the yellow is what
         forced `waiting_human` off amber — two near-identical yellows for two states
         that mean opposite things (ignore me / act now) is worse than no colour. */
      --run:#F9C512;  --run-bg:rgba(249,197,18,0.15);
      --wait:#A371F7; --wait-bg:rgba(163,113,247,0.15);
      --done:#3FB950; --done-bg:rgba(63,185,80,0.15);
      --fail:#F85149; --fail-bg:rgba(248,81,73,0.14);
      --shadow:0 1px 2px rgba(0,0,0,0.4), 0 8px 24px -12px rgba(0,0,0,0.5);
      --radius:12px;
    }
    @media (prefers-color-scheme: light) {
      :root {
        --bg:#F6F7F9; --bg-2:#FFFFFF; --surface:#FFFFFF; --surface-2:#FAFBFC;
        --border:#E4E7EB; --border-2:#D5DAE0; --text:#171A20; --text-mut:#586170; --text-dim:#828B99;
        --accent:#1B7FD4; --accent-2:#1568B0; --accent-bg:rgba(27,127,212,0.10); --accent-line:rgba(27,127,212,0.30);
        --plan:#5A6675; --plan-bg:rgba(90,102,117,0.11);
        --role-plan:#5A6675; --role-dev:#1B7FD4; --role-val:#12925E;
        /* Primer's light-mode status pair. The dark yellow is deliberate: #F9C512 is
           a dot on a dark tab, but as pill text on white it is unreadable. */
        --run:#9A6700;  --run-bg:rgba(154,103,0,0.11);
        --wait:#8250DF; --wait-bg:rgba(130,80,223,0.11);
        --done:#1A7F37; --done-bg:rgba(26,127,55,0.11);
        --fail:#D1242F; --fail-bg:rgba(209,36,47,0.11);
        --shadow:0 1px 2px rgba(24,24,40,0.05), 0 10px 30px -18px rgba(24,24,40,0.18);
      }
    }
    :root[data-theme="dark"] {
    --bg:#0D0E11; --bg-2:#111318; --surface:#171A20; --surface-2:#1D2128;
    --border:#262B34; --border-2:#333A45; --text:#F2F3F5; --text-mut:#969DA8; --text-dim:#6A717C;
    --accent:#4DA3F0; --accent-2:#7CC0FF; --accent-bg:rgba(77,163,240,0.14); --accent-line:rgba(77,163,240,0.38);
    --plan:#8FA6BC; --plan-bg:rgba(143,166,188,0.14);
    --role-plan:#8FA6BC; --role-dev:#4DA3F0; --role-val:#5FD39B;
    --run:#F9C512;  --run-bg:rgba(249,197,18,0.15);
    --wait:#A371F7; --wait-bg:rgba(163,113,247,0.15);
    --done:#3FB950; --done-bg:rgba(63,185,80,0.15);
    --fail:#F85149; --fail-bg:rgba(248,81,73,0.14);
    --shadow:0 1px 2px rgba(0,0,0,0.4), 0 8px 24px -12px rgba(0,0,0,0.5);
    }
    :root[data-theme="light"] {
      --bg:#F6F7F9; --bg-2:#FFFFFF; --surface:#FFFFFF; --surface-2:#FAFBFC;
      --border:#E4E7EB; --border-2:#D5DAE0; --text:#171A20; --text-mut:#586170; --text-dim:#828B99;
      --accent:#1B7FD4; --accent-2:#1568B0; --accent-bg:rgba(27,127,212,0.10); --accent-line:rgba(27,127,212,0.30);
      --plan:#5A6675; --plan-bg:rgba(90,102,117,0.11);
      --role-plan:#5A6675; --role-dev:#1B7FD4; --role-val:#12925E;
      --run:#9A6700;  --run-bg:rgba(154,103,0,0.11);
      --wait:#8250DF; --wait-bg:rgba(130,80,223,0.11);
      --done:#1A7F37; --done-bg:rgba(26,127,55,0.11);
      --fail:#D1242F; --fail-bg:rgba(209,36,47,0.11);
      --shadow:0 1px 2px rgba(24,24,40,0.05), 0 10px 30px -18px rgba(24,24,40,0.18);
    }

    * { box-sizing: border-box; }
    body {
      margin:0; background:var(--bg); color:var(--text);
      font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
      font-size:14px; line-height:1.5; -webkit-font-smoothing:antialiased; letter-spacing:-0.006em;
    }
    .mono { font-family: ui-monospace, "SF Mono", SFMono-Regular, Menlo, monospace; }
    .num  { font-variant-numeric: tabular-nums; }
    body::before {
      content:""; position:fixed; inset:0; pointer-events:none; z-index:0;
      background: radial-gradient(120% 55% at 50% -8%, var(--accent-bg), transparent 60%);
    }

    header {
      position:sticky; top:0; z-index:20; backdrop-filter:blur(12px);
      background: color-mix(in srgb, var(--bg) 78%, transparent);
      border-bottom:1px solid var(--border);
    }
    .bar { max-width:1120px; margin:0 auto; padding:12px 24px; display:flex; align-items:center; gap:16px; }
    .brand { display:flex; align-items:center; gap:10px; font-weight:640; letter-spacing:-0.02em; font-size:15px; text-decoration:none; color:var(--text); }
    .ver { font-size:12px; color:var(--text-dim); }
    .spacer { flex:1; }
    .icon-btn { width:34px; height:34px; border-radius:9px; cursor:pointer; display:grid; place-items:center;
                color:var(--text-mut); background:var(--surface); border:1px solid var(--border); transition:.15s; }
    .icon-btn:hover { color:var(--text); border-color:var(--border-2); }
    .icon-btn svg { width:16px; height:16px; }

    main { position:relative; z-index:1; max-width:1120px; margin:0 auto; padding:32px 24px 80px; }
    h1 { font-size:26px; font-weight:660; letter-spacing:-0.03em; margin:0; text-wrap:balance; }
    .sub { color:var(--text-mut); font-size:13px; margin:6px 0 0; }
    .eyebrow { font-size:11px; font-weight:640; letter-spacing:0.14em; text-transform:uppercase; color:var(--accent-2); }

    /* ============ HERO (empty state) ============ */
    .hero { text-align:center; padding:14px 0 8px; }
    .hero h1 { font-size:clamp(30px,5vw,50px); line-height:1.04; margin:16px auto 0; max-width:14ch; }
    .hero .grad { background:linear-gradient(96deg,var(--accent-2),var(--accent)); -webkit-background-clip:text; background-clip:text; color:transparent; }
    .hero p.lede { color:var(--text-mut); font-size:16px; max-width:52ch; margin:14px auto 0; text-wrap:balance; }

    .stage-wrap { display:flex; justify-content:center; margin:10px 0 6px; }
    .stage { position:relative; width:680px; height:430px; transform-origin:top center; }

    .ropes { position:absolute; inset:0; width:100%; height:100%; z-index:1; overflow:visible; }
    .rope-path { fill:none; stroke:var(--accent-line); stroke-width:1.6; stroke-dasharray:2 7; stroke-linecap:round; opacity:.55; }
    .flow { animation: flowfade 2.4s linear infinite; }
    .flow.d2 { animation-delay:.8s; } .flow.d3 { animation-delay:1.6s; }
    @keyframes flowfade { 0%{opacity:0} 12%{opacity:1} 82%{opacity:1} 100%{opacity:0} }

    .node { position:absolute; z-index:2; width:176px; }
    .node .ncard {
      position:relative; background:var(--surface); border:1px solid var(--border);
      border-radius:14px; padding:11px 12px 12px; box-shadow:var(--shadow); overflow:hidden;
      transition:border-color .4s, box-shadow .4s, transform .4s;
    }
    .node .nhead { display:flex; align-items:center; gap:7px; margin-bottom:9px; }
    .node .ndot { width:8px; height:8px; border-radius:50%; background:var(--c); box-shadow:0 0 0 3px color-mix(in srgb,var(--c) 20%,transparent); }
    .node .nname { font-size:12.5px; font-weight:600; letter-spacing:-0.01em; }
    .node .nact { margin-left:auto; font-size:11px; color:var(--text-dim); }
    .node .nact .dots::after { content:""; animation:dots 1.4s steps(4,end) infinite; }
    @keyframes dots { 0%{content:""} 25%{content:"."} 50%{content:".."} 75%{content:"..."} 100%{content:""} }
    .node .nbody { height:74px; border-radius:9px; background:var(--bg-2); border:1px solid var(--border); position:relative; overflow:hidden; }

    #n-plan .ncard { animation: focusP 9s ease-in-out infinite; }
    #n-dev  .ncard { animation: focusD 9s ease-in-out infinite; }
    #n-val  .ncard { animation: focusV 9s ease-in-out infinite; }
    @keyframes focusP { 0%,4%{} 8%,28%{border-color:var(--c-line); box-shadow:0 0 0 1px var(--c-line),0 0 34px -6px var(--c-glow),var(--shadow); transform:translateY(-3px);} 34%,100%{} }
    @keyframes focusD { 0%,37%{} 41%,61%{border-color:var(--c-line); box-shadow:0 0 0 1px var(--c-line),0 0 34px -6px var(--c-glow),var(--shadow); transform:translateY(-3px);} 67%,100%{} }
    @keyframes focusV { 0%,70%{} 74%,94%{border-color:var(--c-line); box-shadow:0 0 0 1px var(--c-line),0 0 34px -6px var(--c-glow),var(--shadow); transform:translateY(-3px);} 100%{} }
    #n-plan { --c:var(--accent-2); --c-line:var(--accent-line); --c-glow:var(--accent); left:252px; top:0; }
    #n-dev  { --c:var(--role-dev); --c-line:color-mix(in srgb,var(--role-dev) 40%,transparent); --c-glow:var(--role-dev); left:452px; top:300px; }
    #n-val  { --c:var(--role-val); --c-line:color-mix(in srgb,var(--role-val) 40%,transparent); --c-glow:var(--role-val); left:52px; top:300px; }

    .pg { position:absolute; inset:0; }
    .pg .edge { stroke:var(--accent-line); stroke-width:1.5; fill:none; stroke-dasharray:60; stroke-dashoffset:60; animation:draw 3s ease-in-out infinite; }
    .pg .edge.e2 { animation-delay:.5s } .pg .edge.e3 { animation-delay:1s } .pg .edge.e4 { animation-delay:1.4s }
    .pg .pn { fill:var(--surface-2); stroke:var(--accent-2); stroke-width:1.5; transform-origin:center; animation:pop 3s ease-in-out infinite; }
    .pg .pn.n2{animation-delay:.4s} .pg .pn.n3{animation-delay:.9s} .pg .pn.n4{animation-delay:1.3s}

    .code { position:absolute; inset:0; padding:9px 10px; display:flex; flex-direction:column; gap:6px; }
    .code .ln { height:6px; border-radius:3px; width:0; }
    .code .ln > i { display:block; height:100%; border-radius:3px; background:var(--l); width:100%; }
    .code .ln { animation: type 3s ease-in-out infinite; }
    .code .l1{--l:var(--accent-2); max-width:64%; animation-delay:0s}
    .code .l2{--l:var(--run); max-width:88%; animation-delay:.45s}
    .code .l3{--l:var(--text-dim); max-width:52%; animation-delay:.9s}
    .code .l4{--l:var(--done); max-width:76%; animation-delay:1.35s}
    @keyframes type { 0%{width:0} 30%{width:var(--max,100%)} 88%{width:var(--max,100%)} 100%{width:var(--max,100%); opacity:.35} }

    .scan { position:absolute; inset:0; }
    .scan .sln { position:absolute; height:5px; border-radius:3px; background:color-mix(in srgb,var(--text-dim) 45%,transparent); left:10px; }
    .lens { position:absolute; width:30px; height:30px; top:22px; left:0; animation:sweep 3s ease-in-out infinite; }
    .lens .glass { fill:color-mix(in srgb,var(--done) 12%,transparent); stroke:var(--done); stroke-width:2; }
    .lens .handle { stroke:var(--done); stroke-width:2.4; stroke-linecap:round; }
    @keyframes sweep { 0%{left:6px} 46%{left:118px} 54%{left:118px} 100%{left:6px} }
    .bug { position:absolute; left:120px; top:30px; color:var(--fail); animation:bugcatch 3s ease-in-out infinite; }
    .bug svg { width:15px; height:15px; display:block; }
    .caught { position:absolute; left:120px; top:31px; color:var(--done); opacity:0; animation:caught 3s ease-in-out infinite; }
    .caught svg{width:14px;height:14px;display:block}

    .mascot { position:absolute; left:50%; top:150px; transform:translateX(-50%); z-index:3; width:150px; animation:bob 5s ease-in-out infinite; }
    @keyframes bob { 0%,100%{transform:translateX(-50%) translateY(0)} 50%{transform:translateX(-50%) translateY(-9px)} }
    .mascot .shadow { position:absolute; left:50%; bottom:-18px; width:96px; height:16px; transform:translateX(-50%);
                      background:radial-gradient(closest-side, rgba(0,0,0,.35), transparent); animation:shadow 5s ease-in-out infinite; }
    @keyframes shadow { 0%,100%{opacity:.55; transform:translateX(-50%) scale(1)} 50%{opacity:.3; transform:translateX(-50%) scale(.8)} }

    .agent-legend { display:grid; grid-template-columns:repeat(3,1fr); gap:14px; max-width:760px; margin:20px auto 0; }
    .leg { text-align:left; background:var(--surface); border:1px solid var(--border); border-radius:12px; padding:13px 15px; }
    .leg .lh { display:flex; align-items:center; gap:8px; font-weight:600; font-size:13px; }
    .leg .lk { width:8px; height:8px; border-radius:50%; }
    .leg p { margin:6px 0 0; font-size:12.5px; color:var(--text-mut); }

    .install { display:inline-flex; align-items:center; gap:10px; margin:0; padding:9px 12px 9px 16px;
               background:var(--surface); border:1px solid var(--border); border-radius:10px; font-size:13px; }
    .install .cp { width:26px; height:26px; border-radius:7px; display:grid; place-items:center; background:var(--surface-2);
                   border:1px solid var(--border); color:var(--text-mut); cursor:pointer; }
    .install .cp:hover { color:var(--text); }
    .hero-cta { display:flex; gap:12px; align-items:center; justify-content:center; margin-top:24px; flex-wrap:wrap; }
    .cta { display:inline-flex; align-items:center; gap:7px; padding:9px 16px; border-radius:9px; background:var(--accent);
           color:#fff; font-size:13px; font-weight:560; text-decoration:none; border:0; cursor:pointer;
           box-shadow:0 1px 0 rgba(255,255,255,.12) inset, 0 8px 20px -8px var(--accent); transition:.15s; }
    .cta:hover { background:var(--accent-2); }

    /* ============ shared list/detail ============ */
    .live { display:inline-flex; align-items:center; gap:6px; color:var(--text-dim); font-size:12px; }
    .live .pdot { width:6px; height:6px; border-radius:50%; background:var(--done); animation:pulse 2s infinite; }
    @keyframes pulse { 0%{box-shadow:0 0 0 0 color-mix(in srgb,var(--done) 55%,transparent)} 70%{box-shadow:0 0 0 5px transparent} 100%{box-shadow:0 0 0 0 transparent} }

    .summary { display:grid; grid-template-columns:repeat(4,1fr); gap:12px; margin:22px 0 26px; }
    .stat { background:var(--surface); border:1px solid var(--border); border-radius:var(--radius); padding:17px 19px;
            position:relative; overflow:hidden; transition:border-color .2s, transform .2s; }
    .stat::after { content:""; position:absolute; left:0; right:0; top:0; height:1px;
                   background:linear-gradient(90deg, transparent, color-mix(in srgb,var(--c) 50%,transparent), transparent); opacity:.65; }
    .stat:hover { border-color:var(--border-2); transform:translateY(-1px); }
    .stat .n { font-size:29px; font-weight:680; letter-spacing:-0.035em; line-height:1; }
    .stat .l { display:flex; align-items:center; gap:8px; margin-top:12px; font-size:11px; font-weight:600;
               letter-spacing:0.08em; text-transform:uppercase; color:var(--text-dim); }
    .stat .k { width:7px; height:7px; border-radius:50%; background:var(--c); box-shadow:0 0 0 3px color-mix(in srgb,var(--c) 15%,transparent); }

    .card { background:var(--surface); border:1px solid var(--border); border-radius:var(--radius); box-shadow:var(--shadow); overflow:hidden; }
    .tablewrap { overflow-x:auto; }
    table { width:100%; border-collapse:collapse; }
    thead th { text-align:left; font-size:10.5px; font-weight:640; letter-spacing:0.06em; text-transform:uppercase;
               color:var(--text-dim); padding:10px 11px; background:var(--surface-2); border-bottom:1px solid var(--border); white-space:nowrap; }
    thead th.r { text-align:right; }
    tbody td { padding:11px 11px; border-bottom:1px solid var(--border); font-size:12.5px; white-space:nowrap; }
    tbody tr:last-child td { border-bottom:0; }
    tbody tr.row { cursor:pointer; transition:background .12s; }
    tbody tr.row:hover { background:var(--surface-2); }
    tbody tr.row:hover td:first-child { box-shadow:inset 2px 0 0 var(--accent); }
    .slug { font-weight:570; letter-spacing:-0.01em; }
    td.r { text-align:right; }
    .dim { color:var(--text-dim); } .mut { color:var(--text-mut); }
    .cwd { color:var(--text-dim); font-size:12px; }

    .pill { display:inline-flex; align-items:center; gap:6px; padding:3px 9px 3px 8px; border-radius:999px;
            font-size:12px; font-weight:560; line-height:1.4; background:var(--p-bg); color:var(--p);
            box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--p) 22%,transparent); }
    .pill .d { width:6px; height:6px; border-radius:50%; background:var(--p); }
    .pill.spin .d { animation:pulse 1.6s infinite; }
    .s-running{--p:var(--run);--p-bg:var(--run-bg)} .s-waiting{--p:var(--wait);--p-bg:var(--wait-bg)}
    .s-done{--p:var(--done);--p-bg:var(--done-bg)} .s-failed{--p:var(--fail);--p-bg:var(--fail-bg)}
    .s-pending{--p:var(--text-dim);--p-bg:color-mix(in srgb,var(--text-dim) 12%,transparent)}
    .retry-0{color:var(--done)} .retry-1{color:var(--wait)} .retry-2{color:var(--fail)}

    .back { display:inline-flex; align-items:center; gap:6px; color:var(--accent-2); text-decoration:none; font-size:13px; font-weight:520; }
    .back:hover { text-decoration:underline; }
    .head { display:flex; align-items:flex-start; justify-content:space-between; gap:16px; margin:14px 0 4px; flex-wrap:wrap; }
    .metaline { color:var(--text-mut); font-size:13px; margin:9px 0 26px; display:flex; gap:9px;
                align-items:baseline; flex-wrap:wrap; }
    /* A rule, not a glyph: a "·" sits on the text baseline and drifts when the
       items around it are different sizes. A block with its own height stays put. */
    .f-sep { width:1px; height:15px; background:var(--text-dim); opacity:.55; flex:0 0 auto; align-self:center; }
    /* the numbers you scan */
    .f-val { font-size:15px; font-weight:600; color:var(--text); letter-spacing:-0.015em;
             font-variant-numeric:tabular-nums; }
    .f-val span { font-variant-numeric:tabular-nums; }
    /* the context you read once */
    .f-ctx { font-size:12.5px; color:var(--text-dim); }
    .grid2 { display:grid; grid-template-columns:1fr 1fr; gap:16px; margin-bottom:24px; }
    .panel { background:var(--surface); border:1px solid var(--border); border-radius:var(--radius); padding:16px 18px; }
    .panel h3 { margin:0 0 12px; font-size:11px; font-weight:640; letter-spacing:0.07em; text-transform:uppercase; color:var(--text-dim); }
    dl { margin:0; display:grid; grid-template-columns:auto 1fr; gap:7px 14px; font-size:13px; }
    dl dt { color:var(--text-dim); } dl dd { margin:0; color:var(--text); word-break:break-word; }
    /* ---- timeline: the run's real shape. Offset = when, width = how long. ---- */
    .timeline { padding:18px 22px 14px; margin-bottom:24px; }
    /* Ticks turn the empty stretch of a track into a scale: without them the gap
       before a bar reads as blank space rather than as elapsed time. */
    .tl-grid { position:absolute; inset:4px; pointer-events:none; border-radius:3px; overflow:hidden;
               background-image:repeating-linear-gradient(90deg,
                 transparent 0, transparent calc(25% - 1px),
                 var(--border) calc(25% - 1px), var(--border) 25%); opacity:.5; }
    .tl-axis { display:grid; grid-template-columns:88px 1fr 92px; gap:12px; margin-top:8px; }
    .tl-axis-in { position:relative; height:14px; margin:0 4px; }
    .tl-axis-in span { position:absolute; top:0; transform:translateX(-50%); font-size:10px;
                       color:var(--text-dim); font-variant-numeric:tabular-nums; }
    .tl-axis-in span:first-child { transform:none; }
    .tl-axis-in span:last-child { transform:translateX(-100%); }
    .tl-row { display:grid; grid-template-columns:88px 1fr 92px; gap:12px; align-items:center; padding:3px 0; }
    .tl-name { font-size:12.5px; color:var(--text-mut); text-align:right; white-space:nowrap;
               overflow:hidden; text-overflow:ellipsis; }
    .tl-track { position:relative; height:26px; border-radius:7px; background:var(--bg-2);
                box-shadow:inset 0 0 0 1px var(--border); padding:4px; }
    /* the lane is the 0 -> total-time span; bars and the axis below both measure against it */
    .tl-lane { position:relative; height:100%; }
    /* Duration and share ride together at a fixed offset from the track, so the
       numbers stay next to the thing they measure instead of drifting to the far
       edge of a wide card. */
    .tl-meta { display:flex; align-items:baseline; justify-content:flex-end; gap:8px; }
    .tl-bar { position:absolute; top:0; bottom:0; border-radius:5px; min-width:3px;
              background:linear-gradient(180deg, color-mix(in srgb,var(--c) 92%,white), var(--c));
              box-shadow:0 1px 3px -1px color-mix(in srgb,var(--c) 60%,transparent);
              animation:tl-in .5s cubic-bezier(.2,.8,.2,1) both; transform-origin:left center; }
    @keyframes tl-in { from { transform:scaleX(0); opacity:0 } to { transform:scaleX(1); opacity:1 } }
    .tl-bar.live { box-shadow:0 0 0 1px color-mix(in srgb,var(--c) 45%,transparent), 0 0 18px -2px var(--c); }
    .tl-bar.fail { --c:var(--fail); }
    /* the dog rides the head of the bar that is still growing */
    .tl-dog { position:absolute; right:-11px; top:50%; width:22px; height:22px; margin-top:-11px;
              border-radius:50%; background:var(--bg-2); box-shadow:0 0 0 1.5px var(--c); overflow:hidden;
              display:grid; place-items:center; animation:tl-bob 2.4s ease-in-out infinite; }
    .tl-dog img { width:20px; height:20px; display:block; }
    @keyframes tl-bob { 0%,100%{ transform:translateY(0) } 50%{ transform:translateY(-2px) } }
    .tl-dur { font-size:12px; color:var(--text-mut); font-variant-numeric:tabular-nums; }
    .tl-pct { font-size:11px; color:var(--text-dim); font-variant-numeric:tabular-nums; min-width:30px; text-align:right; }
    .tl-row:hover .tl-name, .tl-row:hover .tl-dur { color:var(--text); }
    @media (max-width:720px) { .tl-row, .tl-axis { grid-template-columns:62px 1fr 62px; } .tl-pct { display:none; } }

    /* ---- the ask: the prompt that started it all ---- */
    /* overflow:hidden is load-bearing: it makes the card clip its own rail, so the
       rail follows the corner radius instead of running straight past it. */
    .ask { position:relative; margin:0 0 24px; padding:14px 18px 14px 20px; border-radius:var(--radius);
           background:var(--surface); border:1px solid var(--border); overflow:hidden; }
    /* The rail rides the card's edge — full height, flush at left:0 — and the
       parent's overflow does the shaping: the corner radius eats into it at both
       ends, so it thins into the curve and belongs to the card's outline instead of
       floating beside it. Inset versions of this (a short bar held off the edge, or
       clip-path pointing its own ends) both read as a separate floating element.
       The alpha still fades out top and bottom, the way the stat cards' hairline
       does, so the rail dies away rather than stopping against the corner. */
    .ask::before { content:""; position:absolute; left:0; top:0; bottom:0; width:4px;
                   background:linear-gradient(180deg, transparent 0%,
                     color-mix(in srgb,var(--accent) 60%,transparent) 22%,
                     color-mix(in srgb,var(--accent) 60%,transparent) 78%, transparent 100%);
                   opacity:.85; }
    .ask p { margin:0; font-size:13.5px; color:var(--text-mut); line-height:1.6; text-wrap:pretty;
             display:-webkit-box; -webkit-line-clamp:3; -webkit-box-orient:vertical; overflow:hidden; }
    .ask.open p { -webkit-line-clamp:unset; }

    /* ---- outcome: what the run produced. The reason the page gets opened. ---- */
    .outcome { padding:4px 0; margin-bottom:24px; }
    .oc-row { display:grid; grid-template-columns:auto 1fr; gap:12px; padding:14px 18px; border-top:1px solid var(--border); }
    .oc-row:first-child { border-top:0; }
    .oc-mark { width:20px; height:20px; margin-top:1px; flex:0 0 auto; overflow:visible; }
    .oc-mark.ok { --c:var(--done); } .oc-mark.bad { --c:var(--fail); }
    .oc-ring { fill:color-mix(in srgb,var(--c) 13%,transparent); stroke:var(--c); stroke-width:1.6; opacity:.85; }
    .oc-tick { fill:none; stroke:var(--c); stroke-width:2.2; stroke-linecap:round; stroke-linejoin:round;
               stroke-dasharray:26; stroke-dashoffset:26; animation:oc-draw .42s .12s cubic-bezier(.2,.8,.2,1) forwards; }
    @keyframes oc-draw { to { stroke-dashoffset:0 } }
    .oc-mark.ok .oc-ring { animation:oc-pop .38s cubic-bezier(.2,1.4,.3,1) both; transform-origin:center; transform-box:fill-box; }
    @keyframes oc-pop { from { transform:scale(.7); opacity:0 } to { transform:scale(1); opacity:.85 } }
    .oc-msg { font-size:14px; font-weight:560; letter-spacing:-0.01em; text-wrap:balance; }
    .oc-meta { display:flex; align-items:center; gap:8px; margin-top:5px; font-size:12px; color:var(--text-dim); }
    .oc-files { display:flex; flex-wrap:wrap; gap:6px; margin-top:9px; }
    .oc-files span { font-size:11.5px; color:var(--text-mut); background:var(--surface-2);
                     border:1px solid var(--border); border-radius:6px; padding:2px 7px; }
    .oc-cta { border-top:1px solid var(--border); padding:11px 18px; }
    .oc-cta code { font-size:12px; color:var(--text-mut); background:var(--bg-2);
                   border:1px solid var(--border); border-radius:7px; padding:5px 9px; user-select:all; }

    /* ---- provenance: last on the page, but not behind a click ---- */
    .fold { margin-bottom:24px; }
    .fold-body { padding:2px 18px 18px; }

    /* ---- usage by attempt: a table, because these are columns to compare ---- */
    .ua { width:100%; border-collapse:collapse; font-size:12px; margin:16px 0 22px; }
    /* The vertical padding has to be symmetric because the global `thead th` band
       lands here too: that rule's background and border-bottom are not overridden
       below, only its padding is, so the label sits inside a shaded row. At
       `0 ... 7px` it hugged the top edge of that band with the gap all underneath. */
    .ua th { text-align:left; font-size:10px; font-weight:640; letter-spacing:.07em; text-transform:uppercase;
             color:var(--text-dim); padding:7px 10px 7px 0; white-space:nowrap; }
    .ua th.r, .ua td.num { text-align:right; font-variant-numeric:tabular-nums; }
    .ua td { padding:6px 10px 6px 0; border-top:1px solid var(--border); white-space:nowrap; }
    .ua .ua-name { color:var(--text); }
    .ua .ua-att { color:var(--text-dim); margin-left:5px; font-size:11px; }
    .ua .ua-model { color:var(--text-mut); font-size:11.5px; }
    .ua .ua-cost { color:var(--text); }
    .ua .dim { color:var(--text-dim); }
    .ua tr.ua-fail .ua-name { color:var(--fail); }
    .ua tfoot td { border-top:1px solid var(--border-2); padding-top:8px; color:var(--text-mut);
                   font-size:11px; text-transform:uppercase; letter-spacing:.06em; }
    .ua tfoot .ua-cost { font-size:12.5px; font-weight:600; color:var(--text); text-transform:none; letter-spacing:0; }

    /* ---- collision warning: other runs touched these same files ---- */
    .sib { padding:0; margin-bottom:24px; border-color:color-mix(in srgb,var(--wait) 34%,var(--border)); }
    .sib-why { margin:0; padding:13px 18px; font-size:12.5px; color:var(--text-mut); line-height:1.55;
               background:color-mix(in srgb,var(--wait) 7%,transparent); border-bottom:1px solid var(--border); }
    .sib-row { padding:12px 18px; border-top:1px solid var(--border); }
    .sib-row:first-of-type { border-top:0; }
    .sib-branch { font-size:12.5px; font-weight:600; color:var(--wait); }
    .sib-files { display:flex; flex-wrap:wrap; gap:6px; margin-top:8px; }
    .sib-files span { font-size:11.5px; color:var(--text-mut); background:var(--surface-2);
                      border:1px solid var(--border); border-radius:6px; padding:2px 7px; }

    .section-h { display:flex; align-items:baseline; justify-content:space-between; margin:4px 0 12px; gap:12px; }
    .section-h h2 { margin:0; font-size:15px; font-weight:620; letter-spacing:-0.01em; }
    .section-h .meta { font-size:12.5px; color:var(--text-mut); }

    .iter { margin-bottom:14px; position:relative; }
    .iter::before { content:""; position:absolute; left:26px; top:38px; bottom:8px; width:2px; background:var(--border); z-index:0; }
    .iter-h { display:flex; align-items:center; gap:10px; margin:0 0 8px; }
    .iter-tag { font-size:10.5px; font-weight:660; letter-spacing:0.06em; text-transform:uppercase; color:var(--accent-2);
                background:var(--accent-bg); border:1px solid var(--accent-line); padding:2px 8px; border-radius:6px; }
    .iter-h .t { font-size:13px; color:var(--text-mut); font-weight:500; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
    .phase { display:grid; grid-template-columns:26px 200px auto; align-items:center; gap:16px; padding:11px 14px;
             border-radius:10px; border:1px solid transparent; transition:.12s; position:relative; z-index:1; }
    .phase:hover { background:var(--surface-2); }
    .phase .pmain { display:flex; flex-direction:column; gap:9px; min-width:0; }
    .phase .pname { font-size:13px; font-weight:560; display:flex; align-items:center; }
    /* Verdict and duration sit on the row itself: the phase's whole story in one
       line, so five phases read as five lines instead of five hundred pixels. */
    .phase .pright { display:flex; align-items:center; gap:12px; text-align:right; }
    .pverdict { font-size:11.5px; font-weight:560; padding:2px 8px; border-radius:999px; white-space:nowrap;
                background:color-mix(in srgb,var(--vc) 13%,transparent); color:var(--vc);
                box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--vc) 26%,transparent); }
    .pverdict.ok { --vc:var(--done); } .pverdict.bad { --vc:var(--fail); }
    .pverdict.info { --vc:var(--plan); }
    .pverdict.mono { --vc:var(--text-dim); font-family:ui-monospace,"SF Mono",Menlo,monospace; }
    .pcost { font-size:11.5px; color:var(--text-dim); white-space:nowrap; }
    .phase:hover .pcost { color:var(--text-mut); }
    .phase .pdur { font-size:13px; color:var(--text); font-variant-numeric:tabular-nums; letter-spacing:-0.01em; }
    .phase.run .pdur { color:var(--run); }
    .phase .psid { font-size:11px; color:var(--text-dim); }
    .phase-wrap { border-radius:10px; }
    .transcripts { margin:0 14px 8px 48px; }
    details.transcript { border:1px solid var(--border); border-radius:9px; background:var(--bg-2); margin-top:7px; overflow:hidden; }
    details.transcript > summary { grid-template-columns:14px 1fr auto; padding:8px 12px; font-size:12px; color:var(--text-mut); }
    .transcript-body { padding:4px 12px 12px; display:grid; gap:8px; }
    .tr-event { border-left:2px solid var(--border-2); padding:6px 9px; min-width:0; }
    .tr-event.message { border-color:var(--accent); background:var(--accent-bg); border-radius:0 7px 7px 0; }
    .tr-event.error { border-color:var(--fail); color:var(--fail); }
    .tr-label { color:var(--text-dim); font-size:10px; text-transform:uppercase; letter-spacing:.06em; margin-bottom:4px; }
    .tr-text { font-size:12.5px; overflow-wrap:anywhere; }
    .tr-text p:first-child { margin-top:0; } .tr-text p:last-child { margin-bottom:0; }
    .tr-payload { white-space:pre-wrap; overflow-wrap:anywhere; max-height:420px; overflow:auto; margin:6px 0 0; padding:8px; border-radius:7px; background:var(--surface-2); color:var(--text-mut); font-size:11px; }
    .tr-sub { border:0; background:transparent; }
    .tr-sub > summary { display:flex; grid-template-columns:none; gap:9px; padding:4px 0; color:var(--text-mut);
                        font-size:12px; align-items:baseline; }
    /* the tool's name leads, its argument follows: "Read" alone says nothing */
    .tr-tool { font-weight:600; color:var(--accent-2); flex:0 0 auto; }
    .tr-tool.bad { color:var(--fail); }
    .tr-kind { font-size:10px; text-transform:uppercase; letter-spacing:.08em; color:var(--text-dim); flex:0 0 auto; }
    .tr-peek { color:var(--text-dim); font-size:11.5px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; min-width:0; }
    /* .tr-status is a generic right-aligned slot: sometimes a status word, sometimes
       a timestamp. Only the status words get an s-* class, and those carry --p, so a
       status reads the same colour here as it does in a pill. Timestamps stay dim. */
    .tr-status { margin-left:auto; color:var(--text-dim); }
    .tr-status.s-done, .tr-status.s-running, .tr-status.s-failed,
    .tr-status.s-waiting, .tr-status.s-pending { color:var(--p); font-weight:560; }

    /* The bare .tnode is the PENDING node -- every other state adds a class or is
       reached through .phase.ok, which drops the border for a tick. It was green,
       which is the done colour, so phases that had not started yet read as finished. */
    .tnode { justify-self:center; width:12px; height:12px; border-radius:50%; box-sizing:border-box;
             background:var(--surface); border:2px solid var(--border-2); }
    .tnode.run { background:var(--run); border-color:var(--run); animation:pulse 1.6s infinite; }
    .tnode.planner { border-color:var(--plan); }
    .tnode.fail { background:var(--fail); border-color:var(--fail); }
    .tnode.parked { border-color:var(--wait); }
    .phase.ok .tnode { background:transparent; border:0; border-radius:0; position:relative; }
    .phase.ok .tnode::after { content:""; position:absolute; left:2.5px; top:0; width:4px; height:8px;
                              border:solid var(--done); border-width:0 2px 2px 0; transform:rotate(45deg); }

    .phase.run { display:block; }
    .runhead { display:grid; grid-template-columns:26px 200px auto; align-items:center; gap:16px; }
    .runmeta { display:flex; flex-direction:column; align-items:flex-end; gap:3px; }
    .runmeta .pdur { font-size:13px; color:var(--run); font-variant-numeric:tabular-nums; }
    .runmeta .psid { font-size:11px; color:var(--text-dim); }
    /* live activity of the running phase — real tool calls, not a looping cartoon */
    .workframe { margin:10px 0 2px 33px; max-width:560px; background:var(--bg-2); border:1px solid var(--border);
                 border-radius:10px; padding:9px 12px; }
    .act { display:flex; align-items:baseline; gap:9px; min-width:0; }
    .act .act-dot { width:6px; height:6px; border-radius:50%; background:var(--text-dim); flex:0 0 auto; align-self:center; }
    .act.act-live .act-dot { background:var(--run); animation:pulse 1.6s infinite; }
    .act.act-fail .act-dot { background:var(--fail); }
    .act .act-name { font-size:12.5px; font-weight:600; letter-spacing:-0.01em; flex:0 0 auto; }
    .act.act-fail .act-name { color:var(--fail); }
    .act .act-arg { font-size:12px; color:var(--text-mut); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; min-width:0; }
    .act .act-time { margin-left:auto; font-size:12px; color:var(--text-dim); flex:0 0 auto; }
    .act.act-live .act-time { color:var(--run); }
    .act-idle .act-name { font-weight:500; color:var(--text-dim); font-size:12px; }
    .act-sum { margin-top:5px; font-size:11px; color:var(--text-dim); }


    details.task { border-top:1px solid var(--border); }
    details.task > summary { grid-template-columns:14px minmax(30px,auto) minmax(0,1fr) auto auto minmax(0,auto); }
    details.task:first-of-type { border-top:0; }
    /* The native marker is off, so rows need their own affordance -- without one
       there is nothing telling you a task opens at all. */
    summary { list-style:none; cursor:pointer; padding:13px 16px; display:grid;
              grid-template-columns:14px minmax(30px,auto) minmax(0,1fr) auto auto minmax(0,auto);
              gap:12px; align-items:center; transition:background .12s; }
    summary > * { min-width:0; overflow:hidden; text-overflow:ellipsis; }
    summary::before { content:""; width:6px; height:6px; border:solid var(--text-dim);
                      border-width:0 1.6px 1.6px 0; transform:rotate(-45deg); margin-left:3px;
                      transition:transform .18s cubic-bezier(.2,.8,.2,1), border-color .15s; }
    details[open] > summary::before { transform:rotate(45deg); }
    summary:hover::before { border-color:var(--accent); }
    summary::-webkit-details-marker { display:none; }
    summary:hover { background:var(--surface-2); }
    summary .tid { font-size:12px; color:var(--text-dim); white-space:nowrap; }
    summary .ttitle { font-size:13px; font-weight:540; }
    .task-body { padding:4px 16px 16px 72px; color:var(--text-mut); font-size:12.5px; }
    .events { display:grid; gap:2px; }
    .ev { display:flex; gap:10px; align-items:baseline; font-size:12.5px; padding:4px 0; }
    .ev .when { color:var(--text-dim); min-width:60px; }
    .ev .msg { font-weight:500; } .ev .msg.pass { color:var(--done); } .ev .msg.fail { color:var(--fail); }

    .pipe { display:inline-flex; align-items:center; }
    .pipe .st { width:9px; height:9px; border-radius:50%; border:1.5px solid var(--border-2); background:transparent; flex:0 0 auto; }
    .pipe .st.on { background:var(--sc); border-color:var(--sc); }
    .pipe .st.bad { background:var(--fail); border-color:var(--fail); }
    .pipe .st.act { background:var(--sc); border-color:var(--sc); animation:pulse 1.6s infinite; }
    .pipe .cn { width:16px; height:2px; background:var(--border-2); flex:0 0 auto; }
    .pipe .cn.on { background:var(--accent-line); }

                    background:var(--surface-2); border:1px solid var(--border); color:var(--text-dim); }
                         border-radius:50%; background:var(--run); box-shadow:0 0 10px 1px var(--run); animation:cnflow 1.7s linear infinite; }
    @keyframes cnflow { 0%{left:0; opacity:0} 12%{opacity:1} 88%{opacity:1} 100%{left:100%; opacity:0} }
                      background:color-mix(in srgb,var(--sc) 22%,transparent); }
                             background:var(--sc); animation:mini 1.2s ease-in-out infinite; }

    .animate .reveal { animation:revealUp .55s cubic-bezier(.2,.7,.2,1) both; animation-delay:calc(var(--i,0)*70ms); }
    @keyframes revealUp { from{opacity:0; transform:translateY(12px)} to{opacity:1; transform:none} }
    .live-hd { display:inline-flex; width:6px; height:6px; border-radius:50%; background:var(--done); margin-left:8px; vertical-align:middle; animation:pulse 1.8s infinite; }

    .gg { position:relative; }
    /* --dot and --line are declared so the marker can be centred on the text's
       first line instead of guessing with a hardcoded offset. */
    /* --mark-top is where the dot starts: the row's own padding, plus half the
       leading, so the marker centres on the first line of text however the subject
       wraps. The connector below is expressed in the same term, which is the whole
       point of naming it — the two used to repeat the arithmetic and drift apart. */
    .commit { --line:20px; --dot:12px; --pad:7px; --mark-top:calc(var(--pad) + (var(--line) - var(--dot)) / 2);
              display:flex; gap:10px; align-items:baseline; padding-left:22px;
              position:relative; padding-top:var(--pad); padding-bottom:var(--pad); }
    .commit .sha, .commit .csub { line-height:var(--line); }
    .commit::before { content:""; position:absolute; left:0; top:var(--mark-top);
                      width:var(--dot); height:var(--dot); border-radius:50%;
                      box-sizing:border-box; background:var(--surface); border:2px solid var(--accent); z-index:1; }
    /* Each commit draws the line down to the NEXT one, so a lone commit has no
       line to nowhere. One stroke across the whole list left a stub dangling
       whenever there was a single commit.
       The line has to clear this row's bottom padding AND the next row's --mark-top
       to actually touch the next dot; stopping at -2px left it hanging in the gap.
       It runs 2px under the dot, which is opaque and on top, so there is no seam. */
    .commit::after { content:""; position:absolute; left:calc(var(--dot) / 2 - 1px);
                     top:calc(var(--mark-top) + var(--dot));
                     bottom:calc(-1 * var(--mark-top) - 2px); width:2px; background:var(--accent-line); }
    .commit:last-child::after { display:none; }
    .commit .sha { color:var(--accent-2); font-size:12px; } .commit .csub { font-size:13px; }

    /* markdown task descriptions */
    .task-md { font-size:0.78rem; line-height:1.55; color:var(--text-mut); }
    .task-md p { margin:0.5em 0; } .task-md p:first-child { margin-top:0; } .task-md p:last-child { margin-bottom:0; }
    .task-md code { background:var(--surface-2); padding:0 0.25em; border-radius:3px; font-size:0.95em; font-family:ui-monospace,monospace; }
    .task-md pre { background:var(--surface-2); padding:0.5em 0.75em; border-radius:6px; overflow-x:auto; margin:0.5em 0; }
    .task-md pre code { background:transparent; padding:0; }
    .task-md ul, .task-md ol { margin:0.5em 0; padding-left:1.25em; }
    .task-md li { margin:0.15em 0; }
    .task-md strong { color:var(--text); font-weight:600; }
    .task-md a { color:var(--accent-2); text-decoration:underline; }
    .task-md h1, .task-md h2, .task-md h3, .task-md h4 { font-weight:600; color:var(--text); margin:0.75em 0 0.25em; }

    @media (max-width:720px) {
      .summary { grid-template-columns:repeat(2,1fr); }
      .grid2 { grid-template-columns:1fr; }
      .agent-legend { grid-template-columns:1fr; }
      .phase, .runhead { grid-template-columns:26px 1fr auto; }
    }
    @media (prefers-reduced-motion: reduce) { * { animation:none !important; } }
